<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Land Deal Calculator</title>
<script src="/guard.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,900;1,6..96,500;1,6..96,600&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:#0B0B0B;color:#F1EBE0;font:15px/1.5 "Barlow","Helvetica Neue",Arial,sans-serif}
.dg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.dg .card{width:min(440px,100%);background:#16130F;border:1px solid #C9A96E;outline:1px solid #C9A96E;outline-offset:-7px;padding:30px 26px 26px}
.dg .k{font:600 11px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#C9A96E}
.dg h1{font-family:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;font-weight:900;text-transform:uppercase;font-size:34px;line-height:.95;margin:12px 0 0}
.dg h1 i{display:block;font-weight:500;font-style:italic;text-transform:none;color:#E46BB0}
.dg p{color:#CFC7BA;margin:14px 0 18px}
.dg .btn{display:inline-block;text-decoration:none;font:700 12px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.22em;text-transform:uppercase;background:#C9A96E;color:#0B0B0B;padding:11px 18px}
.dg .btn:focus-visible{outline:2px solid #E46BB0;outline-offset:2px}
.dg small{display:block;margin-top:16px;color:#A39B8E;font-size:12px}
</style>
</head>
<body>
<!-- Private tool. The calculator itself is not in this file: it downloads from a private
     Supabase folder only after /deal-gate.js confirms the signed-in person has access. -->
<main class="dg">
  <div class="card">
    <div class="k">Amr Abdelgawad · Private tool</div>
    <h1>Land Deal <i>Calculator</i></h1>
    <p id="dgMsg" role="status">Checking your access…</p>
    <div id="dgActs" hidden><a class="btn" href="/app/">Open my app</a></div>
    <small>© 2026 Amr Abdelgawad. All rights reserved.</small>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="/tracker/config.js"></script>
<script src="/deal-gate.js?v=2"></script>
<script>DealGateStart({ file: 'land-calculator-v2.html' });</script>
</body>
</html>
