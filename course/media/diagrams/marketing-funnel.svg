<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Marketing funnel: 120 leads become 4 contracts (3.3%) and 3 closed deals (75%); spend $6,000, cost per lead $50, cost per contract $1,500, cost per deal $2,000, average fee $11,000, marketing return 450%.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="710" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">From marketing dollars to closed deals</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">The example month: $6,000 spent, 120 leads, 4 contracts, 3 closed.</text><polygon points="50.0,150 730.0,150 600.0,260 180.0,260" fill="#5B6B7A"/><text x="390" y="200" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">120</text><text x="390" y="230" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Leads</text><text x="390" y="286" font-size="16" font-weight="700" fill="#56635B" text-anchor="middle">Lead-to-contract 3.3%</text><polygon points="180.0,300 600.0,300 540.0,410 240.0,410" fill="#C77A1F"/><text x="390" y="350" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="390" y="380" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Contracts</text><text x="390" y="436" font-size="16" font-weight="700" fill="#56635B" text-anchor="middle">Contract-to-close 75%</text><polygon points="240.0,450 540.0,450 517.5,560 262.5,560" fill="#1F6B45"/><text x="390" y="500" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="390" y="530" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Closed deals</text><rect x="800" y="150" width="352" height="440" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="824" y="200" font-size="17" font-weight="600" fill="#56635B" text-anchor="start">Spend</text><text x="1128" y="200" font-size="24" font-weight="700" fill="#13211A" text-anchor="end">$6,000</text><line x1="824" y1="224" x2="1128" y2="224" stroke="#ECE8E0" stroke-width="2"/><text x="824" y="266" font-size="17" font-weight="600" fill="#56635B" text-anchor="start">Cost per lead</text><text x="1128" y="266" font-size="24" font-weight="700" fill="#13211A" text-anchor="end">$50</text><line x1="824" y1="290" x2="1128" y2="290" stroke="#ECE8E0" stroke-width="2"/><text x="824" y="332" font-size="17" font-weight="600" fill="#56635B" text-anchor="start">Cost per contract</text><text x="1128" y="332" font-size="24" font-weight="700" fill="#13211A" text-anchor="end">$1,500</text><line x1="824" y1="356" x2="1128" y2="356" stroke="#ECE8E0" stroke-width="2"/><text x="824" y="398" font-size="17" font-weight="600" fill="#56635B" text-anchor="start">Cost per closed deal</text><text x="1128" y="398" font-size="24" font-weight="700" fill="#B8461A" text-anchor="end">$2,000</text><line x1="824" y1="422" x2="1128" y2="422" stroke="#ECE8E0" stroke-width="2"/><text x="824" y="464" font-size="17" font-weight="600" fill="#56635B" text-anchor="start">Average fee per deal</text><text x="1128" y="464" font-size="24" font-weight="700" fill="#13211A" text-anchor="end">$11,000</text><line x1="824" y1="488" x2="1128" y2="488" stroke="#ECE8E0" stroke-width="2"/><text x="824" y="530" font-size="17" font-weight="600" fill="#56635B" text-anchor="start">Marketing return</text><text x="1128" y="530" font-size="24" font-weight="700" fill="#B8461A" text-anchor="end">450%</text><text x="48" y="640" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">Judge a channel by cost per deal, not cost per lead, and look at several months. Marketing return counts only marketing</text><text x="48" y="662" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">spend; pay, tools and office come out of the profit too.</text></svg>