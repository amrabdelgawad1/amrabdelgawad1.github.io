<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 716" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Queue order: 1 brand-new inbound leads, 2 scheduled callbacks, 3 hot leads waiting on a next step, 4 today's follow-ups, 5 attempting leads, 6 cold lists in power-hour blocks.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="716" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">The order you work the queue</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">Six levels, from most urgent to least.</text><rect x="48" y="140" width="1104" height="74" rx="12" fill="#FBE6DA" stroke="#FBE6DA" stroke-width="2"/><circle cx="90" cy="177" r="22" fill="#E2602A"/><text x="90" y="184" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="130" y="186" font-size="22" font-weight="700" fill="#13211A" text-anchor="start">Brand-new inbound leads</text><text x="1128" y="186" font-size="18" font-weight="600" fill="#E2602A" text-anchor="end">Minutes matter</text><rect x="93" y="226" width="1014" height="74" rx="12" fill="#FBE6DA" stroke="#FBE6DA" stroke-width="2"/><circle cx="135" cy="263" r="22" fill="#E2602A"/><text x="135" y="270" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="175" y="272" font-size="22" font-weight="700" fill="#13211A" text-anchor="start">Scheduled callbacks at their time</text><text x="1083" y="272" font-size="18" font-weight="600" fill="#E2602A" text-anchor="end">You promised</text><rect x="138" y="312" width="924" height="74" rx="12" fill="#FBEBD3" stroke="#FBEBD3" stroke-width="2"/><circle cx="180" cy="349" r="22" fill="#C77A1F"/><text x="180" y="356" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="220" y="358" font-size="22" font-weight="700" fill="#13211A" text-anchor="start">Hot leads waiting on a next step</text><rect x="183" y="398" width="834" height="74" rx="12" fill="#FBEBD3" stroke="#FBEBD3" stroke-width="2"/><circle cx="225" cy="435" r="22" fill="#C77A1F"/><text x="225" y="442" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="265" y="444" font-size="22" font-weight="700" fill="#13211A" text-anchor="start">Today's follow-ups</text><rect x="228" y="484" width="744" height="74" rx="12" fill="#EDEBE5" stroke="#EDEBE5" stroke-width="2"/><circle cx="270" cy="521" r="22" fill="#56635B"/><text x="270" y="528" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="310" y="530" font-size="22" font-weight="700" fill="#13211A" text-anchor="start">Attempting leads in their cadence</text><rect x="273" y="570" width="654" height="74" rx="12" fill="#EDEBE5" stroke="#EDEBE5" stroke-width="2"/><circle cx="315" cy="607" r="22" fill="#56635B"/><text x="315" y="614" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="355" y="616" font-size="22" font-weight="700" fill="#13211A" text-anchor="start">Cold lists, in power-hour blocks</text><line x1="1170" y1="150" x2="1170" y2="636" stroke="#D5DBD6" stroke-width="4" marker-end="url(#ah)"/><text x="48" y="680" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">Top of the list first. Leads that are waiting on you beat leads you are hunting.</text></svg>