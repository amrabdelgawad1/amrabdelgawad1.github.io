<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Four numbers on Linda's deal: opening offer $68,000, signed $74,000, walk-away MAO $76,500, asking price $180,000; if her real minimum is below the MAO there is a deal, above it cash will not work.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="720" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">The four numbers in every negotiation</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">Your opening and walk-away, her asking price and her real minimum.</text><line x1="80" y1="330" x2="919" y2="330" stroke="#13211A" stroke-width="3"/><line x1="947" y1="330" x2="1120" y2="330" stroke="#13211A" stroke-width="3"/><line x1="913" y1="342" x2="925" y2="318" stroke="#13211A" stroke-width="3"/><line x1="941" y1="342" x2="953" y2="318" stroke="#13211A" stroke-width="3"/><rect x="323" y="314" width="345" height="32" rx="6" fill="#F4B999"/><text x="496" y="470" font-size="17" font-weight="700" fill="#B8461A" text-anchor="middle">Your room to move</text><circle cx="323" cy="330" r="11" fill="#B8461A"/><line x1="323" y1="318" x2="323" y2="284" stroke="#B8461A" stroke-width="2"/><text x="323" y="244" font-size="18" font-weight="700" fill="#B8461A" text-anchor="middle">Your opening</text><text x="323" y="270" font-size="18" font-weight="600" fill="#2C3832" text-anchor="middle">$68,000</text><circle cx="567" cy="330" r="11" fill="#1F6B45"/><line x1="567" y1="342" x2="567" y2="376" stroke="#1F6B45" stroke-width="2"/><text x="567" y="402" font-size="18" font-weight="700" fill="#1F6B45" text-anchor="middle">Signed</text><text x="567" y="426" font-size="18" font-weight="600" fill="#2C3832" text-anchor="middle">$74,000</text><circle cx="668" cy="330" r="11" fill="#B8461A"/><line x1="668" y1="318" x2="668" y2="284" stroke="#B8461A" stroke-width="2"/><text x="668" y="244" font-size="18" font-weight="700" fill="#B8461A" text-anchor="middle">Your walk-away (MAO)</text><text x="668" y="270" font-size="18" font-weight="600" fill="#2C3832" text-anchor="middle">$76,500</text><circle cx="1047" cy="330" r="11" fill="#56635B"/><line x1="1047" y1="318" x2="1047" y2="284" stroke="#56635B" stroke-width="2"/><text x="1047" y="244" font-size="18" font-weight="700" fill="#56635B" text-anchor="middle">Her asking price</text><text x="1047" y="270" font-size="18" font-weight="600" fill="#2C3832" text-anchor="middle">$180,000</text><rect x="48" y="500" width="540" height="110" rx="14" fill="#E3F1E8" stroke="#E3F1E8" stroke-width="2"/><text x="72" y="536" font-size="19" font-weight="700" fill="#1F6B45" text-anchor="start">Her real minimum is BELOW your MAO</text><text x="72" y="568" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">There's a deal. Find where in your range it lands.</text><rect x="612" y="500" width="540" height="110" rx="14" fill="#FBE3E0" stroke="#FBE3E0" stroke-width="2"/><text x="636" y="536" font-size="19" font-weight="700" fill="#A3261D" text-anchor="start">Her real minimum is ABOVE your MAO</text><text x="636" y="568" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Cash won't work. Change the structure (Module 12) or</text><text x="636" y="590" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">schedule a follow-up.</text><text x="48" y="650" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">Linda's real need wasn't a number: a fair, quick sale before winter, split with Mark, no more costs or drives. $74,000</text><text x="48" y="672" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">with the cleanout and her closing date solved it.</text></svg>