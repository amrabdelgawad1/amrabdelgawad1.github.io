<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">A house in four layers: interior (cosmetic), systems, envelope (roof most common big repair) and structure (most expensive, can kill a deal), with cost rising toward structure.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="664" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">A house in four layers</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">From finishes on top to the bones underneath.</text><rect x="169" y="140" width="563" height="104" rx="12" fill="#E3F1E8" stroke="#1F6B45" stroke-width="2"/><text x="193" y="180" font-size="24" font-weight="700" fill="#1F6B45" text-anchor="start">Interior</text><text x="193" y="208" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Kitchen, baths, floors, walls, finishes</text><text x="193" y="232" font-size="15" font-weight="500" fill="#56635B" text-anchor="start" font-style="italic">Mostly cosmetic; where flippers add value</text><circle cx="950" cy="192" r="15" fill="#1F6B45"/><circle cx="996" cy="192" r="15" fill="#E2DED5"/><circle cx="1042" cy="192" r="15" fill="#E2DED5"/><circle cx="1088" cy="192" r="15" fill="#E2DED5"/><rect x="128" y="256" width="643" height="104" rx="12" fill="#FBEBD3" stroke="#C77A1F" stroke-width="2"/><text x="152" y="296" font-size="24" font-weight="700" fill="#C77A1F" text-anchor="start">Systems</text><text x="152" y="324" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Electrical, plumbing, HVAC, septic and well</text><text x="152" y="348" font-size="15" font-weight="500" fill="#56635B" text-anchor="start" font-style="italic">Each has a lifespan; check it against its age</text><circle cx="950" cy="308" r="15" fill="#C77A1F"/><circle cx="996" cy="308" r="15" fill="#C77A1F"/><circle cx="1042" cy="308" r="15" fill="#E2DED5"/><circle cx="1088" cy="308" r="15" fill="#E2DED5"/><rect x="88" y="372" width="724" height="104" rx="12" fill="#FBE6DA" stroke="#C4571F" stroke-width="2"/><text x="112" y="412" font-size="24" font-weight="700" fill="#C4571F" text-anchor="start">Envelope</text><text x="112" y="440" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Roof, siding, windows, doors, drainage</text><text x="112" y="464" font-size="15" font-weight="500" fill="#56635B" text-anchor="start" font-style="italic">The roof is the most common big-ticket repair</text><circle cx="950" cy="424" r="15" fill="#C4571F"/><circle cx="996" cy="424" r="15" fill="#C4571F"/><circle cx="1042" cy="424" r="15" fill="#C4571F"/><circle cx="1088" cy="424" r="15" fill="#E2DED5"/><rect x="48" y="488" width="804" height="104" rx="12" fill="#FBE3E0" stroke="#A3261D" stroke-width="2"/><text x="72" y="528" font-size="24" font-weight="700" fill="#A3261D" text-anchor="start">Structure</text><text x="72" y="556" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Foundation and framing</text><text x="72" y="580" font-size="15" font-weight="500" fill="#56635B" text-anchor="start" font-style="italic">The most expensive; can kill a deal</text><circle cx="950" cy="540" r="15" fill="#A3261D"/><circle cx="996" cy="540" r="15" fill="#A3261D"/><circle cx="1042" cy="540" r="15" fill="#A3261D"/><circle cx="1088" cy="540" r="15" fill="#A3261D"/><text x="935" y="128" font-size="16" font-weight="700" fill="#56635B" text-anchor="start">Cost and risk</text><line x1="910" y1="160" x2="910" y2="584" stroke="#D5DBD6" stroke-width="4" marker-end="url(#ah)"/><text x="48" y="630" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">Problems get more expensive the deeper you go. A bad kitchen is cosmetic. A bad foundation can kill a deal.</text></svg>