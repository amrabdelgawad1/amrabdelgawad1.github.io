<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Four pillars scorecard: motivation, timeline, condition and price each scored 1 to 3; totals of 10 to 12 hot, 7 to 9 warm, 5 to 6 nurture, 4 dead for now.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="800" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">Scoring a lead on the four pillars</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">Score each pillar 1 to 3, add them, and the total tells you what to do.</text><text x="156" y="160" font-size="21" font-weight="700" fill="#13211A" text-anchor="start">Motivation</text><text x="412" y="160" font-size="21" font-weight="700" fill="#13211A" text-anchor="start">Timeline</text><text x="668" y="160" font-size="21" font-weight="700" fill="#13211A" text-anchor="start">Condition</text><text x="924" y="160" font-size="21" font-weight="700" fill="#13211A" text-anchor="start">Price</text><circle cx="90" cy="237" r="30" fill="#E2602A"/><text x="90" y="247" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="140" y="178" width="244" height="118" rx="12" fill="#FBE6DA" stroke="#FBE6DA" stroke-width="2"/><text x="156" y="212" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">A real problem: estate,</text><text x="156" y="234" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">move, debt, landlord</text><text x="156" y="256" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">burnout, repairs they</text><text x="156" y="278" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">can't afford</text><rect x="396" y="178" width="244" height="118" rx="12" fill="#FBE6DA" stroke="#FBE6DA" stroke-width="2"/><text x="412" y="212" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Under 60 days</text><rect x="652" y="178" width="244" height="118" rx="12" fill="#FBE6DA" stroke="#FBE6DA" stroke-width="2"/><text x="668" y="212" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Needs real work</text><rect x="908" y="178" width="244" height="118" rx="12" fill="#FBE6DA" stroke="#FBE6DA" stroke-width="2"/><text x="924" y="212" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Flexible, or near as-is</text><text x="924" y="234" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">value</text><circle cx="90" cy="367" r="30" fill="#C77A1F"/><text x="90" y="377" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="140" y="308" width="244" height="118" rx="12" fill="#FBEBD3" stroke="#FBEBD3" stroke-width="2"/><text x="156" y="342" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Interested, a reason</text><text x="156" y="364" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">but no pressure</text><rect x="396" y="308" width="244" height="118" rx="12" fill="#FBEBD3" stroke="#FBEBD3" stroke-width="2"/><text x="412" y="342" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">2 to 6 months</text><rect x="652" y="308" width="244" height="118" rx="12" fill="#FBEBD3" stroke="#FBEBD3" stroke-width="2"/><text x="668" y="342" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Dated, light work</text><rect x="908" y="308" width="244" height="118" rx="12" fill="#FBEBD3" stroke="#FBEBD3" stroke-width="2"/><text x="924" y="342" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Above as-is value, but</text><text x="924" y="364" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">they'll listen</text><circle cx="90" cy="497" r="30" fill="#56635B"/><text x="90" y="507" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="140" y="438" width="244" height="118" rx="12" fill="#EDEBE5" stroke="#EDEBE5" stroke-width="2"/><text x="156" y="472" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Just curious, "what's</text><text x="156" y="494" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">it worth?"</text><rect x="396" y="438" width="244" height="118" rx="12" fill="#EDEBE5" stroke="#EDEBE5" stroke-width="2"/><text x="412" y="472" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">No date, "someday"</text><rect x="652" y="438" width="244" height="118" rx="12" fill="#EDEBE5" stroke="#EDEBE5" stroke-width="2"/><text x="668" y="472" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Updated</text><rect x="908" y="438" width="244" height="118" rx="12" fill="#EDEBE5" stroke="#EDEBE5" stroke-width="2"/><text x="924" y="472" font-size="17" font-weight="500" fill="#2C3832" text-anchor="start">Retail or higher, firm</text><text x="48" y="598" font-size="21" font-weight="700" fill="#13211A" text-anchor="start">Add the four scores (4 to 12)</text><rect x="48" y="620" width="268" height="112" rx="10" fill="#EDEBE5" stroke="#56635B" stroke-width="2"/><text x="62" y="650" font-size="18" font-weight="700" fill="#56635B" text-anchor="start">4</text><text x="62" y="676" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Dead for now</text><text x="62" y="700" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">90-day check-in</text><rect x="326" y="620" width="268" height="112" rx="10" fill="#E3F1E8" stroke="#1F6B45" stroke-width="2"/><text x="340" y="650" font-size="18" font-weight="700" fill="#1F6B45" text-anchor="start">5 to 6</text><text x="340" y="676" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Nurture</text><text x="340" y="700" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Monthly, with a reason</text><rect x="605" y="620" width="268" height="112" rx="10" fill="#FBEBD3" stroke="#C77A1F" stroke-width="2"/><text x="619" y="650" font-size="18" font-weight="700" fill="#C77A1F" text-anchor="start">7 to 9</text><text x="619" y="676" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Warm</text><text x="619" y="700" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Appointment, or follow-up</text><text x="619" y="720" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">within a week</text><rect x="884" y="620" width="268" height="112" rx="10" fill="#FBE6DA" stroke="#E2602A" stroke-width="2"/><text x="898" y="650" font-size="18" font-weight="700" fill="#E2602A" text-anchor="start">10 to 12</text><text x="898" y="676" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Hot</text><text x="898" y="700" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Set the appointment today</text><text x="48" y="766" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">Motivation outweighs everything: a real problem with a high price often comes down.</text></svg>