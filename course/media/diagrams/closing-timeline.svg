<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Cash deal timeline: day 0 contract signed, days 1 to 3 earnest money, days 3 to 10 title search, title commitment, curative work, dispo assigns or double closes, settlement statement approved, then signing, funding and recording.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="700" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">The timeline of a typical cash deal</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">From the signed contract to the recorded deed.</text><line x1="90" y1="380" x2="1110" y2="380" stroke="#13211A" stroke-width="4"/><circle cx="90" cy="380" r="14" fill="#E2602A"/><circle cx="90" cy="380" r="6" fill="#FFFFFF"/><line x1="90" y1="364" x2="90" y2="330" stroke="#E2602A" stroke-width="2"/><rect x="24" y="170" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="40" y="200" font-size="14" font-weight="700" fill="#E2602A" text-anchor="start">DAY 0</text><text x="40" y="228" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Contract signed</text><text x="40" y="259" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Send to title the same</text><text x="40" y="278" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">day</text><circle cx="236" cy="380" r="14" fill="#1F6B45"/><circle cx="236" cy="380" r="6" fill="#FFFFFF"/><line x1="236" y1="396" x2="236" y2="430" stroke="#1F6B45" stroke-width="2"/><rect x="121" y="430" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="137" y="460" font-size="14" font-weight="700" fill="#1F6B45" text-anchor="start">DAYS 1 TO 3</text><text x="137" y="488" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Earnest money</text><text x="137" y="519" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Deposited with title; get</text><text x="137" y="538" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">a receipt</text><circle cx="381" cy="380" r="14" fill="#1F6B45"/><circle cx="381" cy="380" r="6" fill="#FFFFFF"/><line x1="381" y1="364" x2="381" y2="330" stroke="#1F6B45" stroke-width="2"/><rect x="266" y="170" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="282" y="200" font-size="14" font-weight="700" fill="#1F6B45" text-anchor="start">DAYS 3 TO 10</text><text x="282" y="228" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Title search</text><text x="282" y="259" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Ownership, mortgages,</text><text x="282" y="278" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">liens, judgments, taxes</text><circle cx="527" cy="380" r="14" fill="#1F6B45"/><circle cx="527" cy="380" r="6" fill="#FFFFFF"/><line x1="527" y1="396" x2="527" y2="430" stroke="#1F6B45" stroke-width="2"/><rect x="412" y="430" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="428" y="460" font-size="14" font-weight="700" fill="#1F6B45" text-anchor="start">NEXT</text><text x="428" y="488" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Title commitment</text><text x="428" y="519" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">What must be fixed before</text><text x="428" y="538" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">closing</text><circle cx="673" cy="380" r="14" fill="#C77A1F"/><circle cx="673" cy="380" r="6" fill="#FFFFFF"/><line x1="673" y1="364" x2="673" y2="330" stroke="#C77A1F" stroke-width="2"/><rect x="558" y="170" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="574" y="200" font-size="14" font-weight="700" fill="#C77A1F" text-anchor="start">NEXT</text><text x="574" y="228" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Curative work</text><text x="574" y="259" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Payoffs, releases,</text><text x="574" y="278" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">probate papers. Where</text><text x="574" y="298" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">delays happen</text><circle cx="819" cy="380" r="14" fill="#1F6B45"/><circle cx="819" cy="380" r="6" fill="#FFFFFF"/><line x1="819" y1="396" x2="819" y2="430" stroke="#1F6B45" stroke-width="2"/><rect x="704" y="430" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="720" y="460" font-size="14" font-weight="700" fill="#1F6B45" text-anchor="start">NEXT</text><text x="720" y="488" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Dispo assigns or</text><text x="720" y="513" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">double closes</text><text x="720" y="543" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">End buyer walks through,</text><text x="720" y="563" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">puts up a deposit</text><circle cx="964" cy="380" r="14" fill="#1F6B45"/><circle cx="964" cy="380" r="6" fill="#FFFFFF"/><line x1="964" y1="364" x2="964" y2="330" stroke="#1F6B45" stroke-width="2"/><rect x="849" y="170" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="865" y="200" font-size="14" font-weight="700" fill="#1F6B45" text-anchor="start">NEXT</text><text x="865" y="228" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Settlement</text><text x="865" y="253" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">statement</text><text x="865" y="283" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Everyone reviews the</text><text x="865" y="303" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">numbers</text><circle cx="1110" cy="380" r="14" fill="#E2602A"/><circle cx="1110" cy="380" r="6" fill="#FFFFFF"/><line x1="1110" y1="396" x2="1110" y2="430" stroke="#E2602A" stroke-width="2"/><rect x="946" y="430" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="962" y="460" font-size="14" font-weight="700" fill="#E2602A" text-anchor="start">CLOSING</text><text x="962" y="488" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Sign, fund, record</text><text x="962" y="519" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Deed signed, buyer funds,</text><text x="962" y="538" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">title records and pays</text><text x="48" y="640" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">A clean cash deal can close in 7 to 21 days. Probate, liens or missing heirs can push it to 60 to 120+ days. Set that</text><text x="48" y="662" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">expectation on the first call.</text></svg>