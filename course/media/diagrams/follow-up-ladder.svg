<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 746" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Follow-up ladder: hot within 24 hours then every 2 to 3 days; warm in 1 week then every 2 weeks; nurture in 30 days then monthly; cold in 90 days then every 3 to 6 months; do-not-call never.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="746" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">The follow-up ladder</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">After you have talked: how soon to call back, then how often.</text><text x="350" y="140" font-size="15" font-weight="700" fill="#56635B" text-anchor="start">NEXT TOUCH</text><text x="610" y="140" font-size="15" font-weight="700" fill="#56635B" text-anchor="start">THEN</text><rect x="48" y="156" width="1104" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="48" y="156" width="10" height="92" rx="5" fill="#E2602A"/><text x="74" y="194" font-size="24" font-weight="700" fill="#E2602A" text-anchor="start">Hot</text><text x="74" y="222" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Wants an offer, timeline under</text><text x="74" y="243" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">30 days</text><rect x="350" y="178" width="230" height="48" rx="24" fill="#FBE6DA" stroke="#FBE6DA" stroke-width="2"/><text x="465" y="209" font-size="19" font-weight="700" fill="#E2602A" text-anchor="middle">Within 24 hours</text><text x="610" y="198" font-size="18" font-weight="500" fill="#2C3832" text-anchor="start">Every 2 to 3 days until signed or no</text><rect x="60" y="262" width="1092" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="60" y="262" width="10" height="92" rx="5" fill="#C77A1F"/><text x="86" y="300" font-size="24" font-weight="700" fill="#C77A1F" text-anchor="start">Warm</text><text x="86" y="328" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Interested, timeline 1 to 3</text><text x="86" y="349" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">months</text><rect x="350" y="284" width="230" height="48" rx="24" fill="#FBEBD3" stroke="#FBEBD3" stroke-width="2"/><text x="465" y="315" font-size="19" font-weight="700" fill="#C77A1F" text-anchor="middle">In 1 week</text><text x="610" y="304" font-size="18" font-weight="500" fill="#2C3832" text-anchor="start">Every 2 weeks</text><rect x="72" y="368" width="1080" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="72" y="368" width="10" height="92" rx="5" fill="#1F6B45"/><text x="98" y="406" font-size="24" font-weight="700" fill="#1F6B45" text-anchor="start">Nurture</text><text x="98" y="434" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">"Not yet" or 3 to 12 months</text><text x="98" y="455" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">away</text><rect x="350" y="390" width="230" height="48" rx="24" fill="#E3F1E8" stroke="#E3F1E8" stroke-width="2"/><text x="465" y="421" font-size="19" font-weight="700" fill="#1F6B45" text-anchor="middle">In 30 days</text><text x="610" y="410" font-size="18" font-weight="500" fill="#2C3832" text-anchor="start">Monthly, plus any event (price drop, listing expires,</text><text x="610" y="433" font-size="18" font-weight="500" fill="#2C3832" text-anchor="start">season change)</text><rect x="84" y="474" width="1068" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="84" y="474" width="10" height="92" rx="5" fill="#5B6B7A"/><text x="110" y="512" font-size="24" font-weight="700" fill="#5B6B7A" text-anchor="start">Cold</text><text x="110" y="540" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">"No" but polite</text><rect x="350" y="496" width="230" height="48" rx="24" fill="#E6ECF1" stroke="#E6ECF1" stroke-width="2"/><text x="465" y="527" font-size="19" font-weight="700" fill="#5B6B7A" text-anchor="middle">In 90 days</text><text x="610" y="516" font-size="18" font-weight="500" fill="#2C3832" text-anchor="start">Every 3 to 6 months</text><rect x="96" y="580" width="1056" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="96" y="580" width="10" height="92" rx="5" fill="#A3261D"/><text x="122" y="618" font-size="24" font-weight="700" fill="#A3261D" text-anchor="start">Do-not-call</text><text x="122" y="646" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Asked not to be called</text><rect x="350" y="602" width="230" height="48" rx="24" fill="#FBE3E0" stroke="#FBE3E0" stroke-width="2"/><text x="465" y="633" font-size="19" font-weight="700" fill="#A3261D" text-anchor="middle">Never</text><text x="610" y="622" font-size="18" font-weight="500" fill="#2C3832" text-anchor="start">Never</text><text x="48" y="710" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">Every follow-up needs a reason. "Not interested" moves to the slower cycle; only a stop request ends it.</text></svg>