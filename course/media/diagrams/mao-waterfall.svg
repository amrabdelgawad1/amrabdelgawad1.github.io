<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">MAO waterfall for Linda's house: ARV $215,000, times 70% is $150,500, minus $59,000 repairs gives $91,500 end buyer price, minus $15,000 fee gives $76,500 MAO; opening offer $65,000 to $68,000.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="700" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">Linda's MAO, step by step</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">From the after-repair value down to the most you can sign.</text><rect x="48" y="160" width="120" height="400" rx="6" fill="#13211A"/><text x="108" y="148" font-size="19" font-weight="700" fill="#13211A" text-anchor="middle">$215,000</text><text x="108" y="592" font-size="17" font-weight="600" fill="#13211A" text-anchor="middle">ARV</text><line x1="168" y1="160" x2="212" y2="160" stroke="#56635B" stroke-width="2" stroke-dasharray="5 5"/><rect x="212" y="160" width="120" height="120" rx="6" fill="#9AA59E"/><text x="272" y="148" font-size="19" font-weight="700" fill="#56635B" text-anchor="middle">− $64,500</text><text x="272" y="592" font-size="17" font-weight="600" fill="#13211A" text-anchor="middle">× 70%</text><line x1="332" y1="280" x2="376" y2="280" stroke="#56635B" stroke-width="2" stroke-dasharray="5 5"/><rect x="376" y="280" width="120" height="110" rx="6" fill="#C77A1F"/><text x="436" y="268" font-size="19" font-weight="700" fill="#C77A1F" text-anchor="middle">− $59,000</text><text x="436" y="592" font-size="17" font-weight="600" fill="#13211A" text-anchor="middle">Repairs</text><line x1="496" y1="390" x2="540" y2="390" stroke="#56635B" stroke-width="2" stroke-dasharray="5 5"/><rect x="540" y="390" width="120" height="170" rx="6" fill="#1F6B45"/><text x="600" y="378" font-size="19" font-weight="700" fill="#1F6B45" text-anchor="middle">$91,500</text><text x="600" y="592" font-size="17" font-weight="600" fill="#13211A" text-anchor="middle">End buyer</text><text x="600" y="614" font-size="17" font-weight="600" fill="#13211A" text-anchor="middle">price</text><line x1="660" y1="390" x2="704" y2="390" stroke="#56635B" stroke-width="2" stroke-dasharray="5 5"/><rect x="704" y="390" width="120" height="28" rx="6" fill="#E2602A"/><text x="764" y="378" font-size="19" font-weight="700" fill="#E2602A" text-anchor="middle">− $15,000</text><text x="764" y="592" font-size="17" font-weight="600" fill="#13211A" text-anchor="middle">Your fee</text><line x1="824" y1="418" x2="868" y2="418" stroke="#56635B" stroke-width="2" stroke-dasharray="5 5"/><rect x="868" y="418" width="120" height="142" rx="6" fill="#B8461A"/><text x="928" y="406" font-size="19" font-weight="700" fill="#B8461A" text-anchor="middle">$76,500</text><text x="928" y="592" font-size="17" font-weight="600" fill="#13211A" text-anchor="middle">Your MAO</text><rect x="1032" y="433" width="120" height="127" rx="6" fill="#FBE6DA" stroke="#E2602A" stroke-width="2" stroke-dasharray="6 5"/><text x="1092" y="421" font-size="18" font-weight="700" fill="#B8461A" text-anchor="middle">$65k to $68k</text><text x="1092" y="592" font-size="17" font-weight="600" fill="#13211A" text-anchor="middle">Opening offer</text><line x1="40" y1="560" x2="1160" y2="560" stroke="#13211A" stroke-width="2"/><text x="48" y="668" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">MAO = (ARV × 70%) − repairs − your fee. Open 10% to 15% below MAO. Linda signed at $74,000, under the $76,500 walk-away.</text></svg>