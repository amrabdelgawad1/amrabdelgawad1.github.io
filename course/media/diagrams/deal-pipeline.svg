<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">The deal pipeline in seven steps: marketing, cold caller, lead manager, acquisitions (highlighted), transaction coordinator and title, dispositions, closing.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="560" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">Where acquisitions sits in the deal</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">Seven seats, one deal. Acquisitions turns a qualified lead into a signed agreement.</text><rect x="48" y="150" width="146" height="300" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="78" cy="184" r="18" fill="#13211A"/><text x="78" y="190" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="236" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Marketing</text><text x="62" y="261" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">and lists</text><text x="62" y="295" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">Lists, driving</text><text x="62" y="316" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">for dollars,</text><text x="62" y="337" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">mail, texting,</text><text x="62" y="358" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">ads</text><rect x="208" y="150" width="146" height="300" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="238" cy="184" r="18" fill="#13211A"/><text x="238" y="190" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="222" y="236" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Cold caller</text><text x="222" y="261" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">or texter</text><text x="222" y="295" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">Finds</text><text x="222" y="316" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">interest,</text><text x="222" y="337" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">collects the 4</text><text x="222" y="358" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">pillars, sets</text><text x="222" y="379" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">the</text><text x="222" y="399" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">appointment</text><rect x="367" y="150" width="146" height="300" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="397" cy="184" r="18" fill="#13211A"/><text x="397" y="190" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="381" y="236" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Lead</text><text x="381" y="261" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">manager</text><text x="381" y="295" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">Qualifies</text><text x="381" y="316" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">deeper, books</text><text x="381" y="337" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">the acq call</text><rect x="527" y="150" width="146" height="300" rx="14" fill="#FBE6DA" stroke="#E2602A" stroke-width="3"/><circle cx="557" cy="184" r="18" fill="#E2602A"/><text x="557" y="190" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="541" y="236" font-size="19" font-weight="700" fill="#B8461A" text-anchor="start">Acquisitions</text><text x="541" y="271" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">Discovery,</text><text x="541" y="292" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">pain, comps,</text><text x="541" y="312" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">offer,</text><text x="541" y="333" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">negotiation,</text><text x="541" y="354" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">signed</text><text x="541" y="375" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">agreement</text><rect x="687" y="150" width="146" height="300" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="717" cy="184" r="18" fill="#13211A"/><text x="717" y="190" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="701" y="236" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">TC and</text><text x="701" y="261" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">title</text><text x="701" y="295" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">Opens title,</text><text x="701" y="316" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">earnest money,</text><text x="701" y="337" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">tracks</text><text x="701" y="358" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">deadlines</text><rect x="847" y="150" width="146" height="300" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="877" cy="184" r="18" fill="#13211A"/><text x="877" y="190" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="861" y="236" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Dispositions</text><text x="861" y="271" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">Markets the</text><text x="861" y="292" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">contract,</text><text x="861" y="312" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">assigns or</text><text x="861" y="333" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">double closes</text><rect x="1006" y="150" width="146" height="300" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="1036" cy="184" r="18" fill="#13211A"/><text x="1036" y="190" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="1020" y="236" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Closing</text><text x="1020" y="271" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">Seller paid,</text><text x="1020" y="292" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">buyer gets the</text><text x="1020" y="312" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">deed, everyone</text><text x="1020" y="333" font-size="16" font-weight="500" fill="#2C3832" text-anchor="start">paid</text><line x1="48" y1="480" x2="1152" y2="480" stroke="#D5DBD6" stroke-width="3"/><line x1="128" y1="480" x2="273" y2="480" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><line x1="288" y1="480" x2="433" y2="480" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><line x1="448" y1="480" x2="593" y2="480" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><line x1="607" y1="480" x2="752" y2="480" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><line x1="767" y1="480" x2="912" y2="480" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><line x1="927" y1="480" x2="1072" y2="480" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><text x="48" y="530" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">Smaller teams merge the lead manager seat with acquisitions.</text></svg>