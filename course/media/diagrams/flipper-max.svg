<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Flipper's maximum: of a $215,000 ARV, rehab $59,000, profit target $32,250, selling costs $17,200, holding $9,000, buying costs $1,913, leaving about $95,600; with a $74,000 contract the fee room is about $17,500 to $21,000.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="620" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">What a flipper can pay for Linda's house</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">Work backward from the ARV and a 15% profit target.</text><text x="48" y="168" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">ARV  $215,000</text><rect x="48" y="190" width="489" height="90" rx="6" fill="#1F6B45"/><rect x="539" y="190" width="301" height="90" rx="6" fill="#C77A1F"/><rect x="842" y="190" width="164" height="90" rx="6" fill="#5B6B7A"/><rect x="1007" y="190" width="86" height="90" rx="6" fill="#8E9A93"/><rect x="1096" y="190" width="44" height="90" rx="6" fill="#B5BDB8"/><rect x="1142" y="190" width="8" height="90" rx="6" fill="#D6DBD7"/><text x="62" y="228" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Most a flipper can pay</text><text x="62" y="256" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">$95,600</text><text x="553" y="228" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Rehab</text><text x="553" y="256" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">$59,000</text><line x1="925" y1="284" x2="925" y2="306" stroke="#56635B" stroke-width="2"/><text x="925" y="326" font-size="17" font-weight="600" fill="#2C3832" text-anchor="middle">Profit target (15%): $32,250</text><line x1="1052" y1="284" x2="1052" y2="356" stroke="#56635B" stroke-width="2"/><text x="1052" y="376" font-size="17" font-weight="600" fill="#2C3832" text-anchor="end">Selling costs (8%): $17,200</text><line x1="1119" y1="284" x2="1119" y2="406" stroke="#56635B" stroke-width="2"/><text x="1119" y="426" font-size="17" font-weight="600" fill="#2C3832" text-anchor="end">Holding (6 months): $9,000</text><line x1="1147" y1="284" x2="1147" y2="456" stroke="#56635B" stroke-width="2"/><text x="1147" y="476" font-size="17" font-weight="600" fill="#2C3832" text-anchor="end">Buying costs: $1,913</text><line x1="48" y1="490" x2="539" y2="490" stroke="#D5DBD6" stroke-width="3"/><circle cx="428" cy="490" r="9" fill="#B8461A"/><circle cx="518" cy="490" r="9" fill="#1F6B45"/><circle cx="539" cy="490" r="9" fill="#1F6B45"/><text x="428" y="468" font-size="17" font-weight="700" fill="#B8461A" text-anchor="end">Contract $74,000</text><text x="553" y="472" font-size="16" font-weight="600" fill="#1F6B45" text-anchor="start">$91,500 (70% rule) to</text><text x="553" y="496" font-size="16" font-weight="600" fill="#1F6B45" text-anchor="start">$95,600 (flipper max)</text><rect x="428" y="508" width="111" height="10" rx="5" fill="#E2602A"/><text x="483" y="546" font-size="18" font-weight="700" fill="#B8461A" text-anchor="middle">Fee room about $17,500 to $21,000</text><text x="48" y="590" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">If the buyer's profit falls below roughly 10% to 15% of ARV, most flippers pass.</text></svg>