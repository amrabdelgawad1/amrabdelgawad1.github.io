<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 704" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">The ten stages of the call: intro and permission, upfront agreement, rapport, property walkthrough, motivation and pain, timeline, money and decision makers, price, offer and negotiation, close and next steps.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="704" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">The 10 stages of the acquisition call</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">The order every call follows, from hello to the signed agreement.</text><rect x="48" y="140" width="210" height="200" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="48" y="140" width="210" height="8" rx="4" fill="#5B6B7A"/><circle cx="78" cy="184" r="18" fill="#5B6B7A"/><text x="78" y="190" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="64" y="232" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Intro and</text><text x="64" y="255" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">permission</text><text x="64" y="285" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Who you are, why</text><text x="64" y="304" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">you're calling, good</text><text x="64" y="324" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">time?</text><line x1="259" y1="184" x2="271" y2="184" stroke="#D5DBD6" stroke-width="3" marker-end="url(#ah)"/><rect x="272" y="140" width="210" height="200" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="272" y="140" width="210" height="8" rx="4" fill="#5B6B7A"/><circle cx="302" cy="184" r="18" fill="#5B6B7A"/><text x="302" y="190" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="288" y="232" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Upfront agreement</text><text x="288" y="261" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">How the call works;</text><text x="288" y="281" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">"no" is an okay answer</text><line x1="482" y1="184" x2="494" y2="184" stroke="#D5DBD6" stroke-width="3" marker-end="url(#ah)"/><rect x="495" y="140" width="210" height="200" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="495" y="140" width="210" height="8" rx="4" fill="#5B6B7A"/><circle cx="525" cy="184" r="18" fill="#5B6B7A"/><text x="525" y="190" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="511" y="232" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Rapport</text><text x="511" y="261" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Real, brief and about</text><text x="511" y="281" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">them</text><line x1="706" y1="184" x2="718" y2="184" stroke="#D5DBD6" stroke-width="3" marker-end="url(#ah)"/><rect x="719" y="140" width="210" height="200" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="719" y="140" width="210" height="8" rx="4" fill="#1F6B45"/><circle cx="749" cy="184" r="18" fill="#1F6B45"/><text x="749" y="190" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="735" y="232" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Property</text><text x="735" y="255" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">walkthrough</text><text x="735" y="285" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Room by room, roof and</text><text x="735" y="304" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">HVAC age, sq ft</text><line x1="929" y1="184" x2="941" y2="184" stroke="#D5DBD6" stroke-width="3" marker-end="url(#ah)"/><rect x="942" y="140" width="210" height="200" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="942" y="140" width="210" height="8" rx="4" fill="#1F6B45"/><circle cx="972" cy="184" r="18" fill="#1F6B45"/><text x="972" y="190" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="958" y="232" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Motivation and</text><text x="958" y="255" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">pain</text><text x="958" y="285" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Why sell, why now;</text><text x="958" y="304" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">down to layer 3</text><rect x="48" y="384" width="210" height="200" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="48" y="384" width="210" height="8" rx="4" fill="#1F6B45"/><circle cx="78" cy="428" r="18" fill="#1F6B45"/><text x="78" y="434" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="64" y="476" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Timeline</text><text x="64" y="505" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">When to close, where</text><text x="64" y="525" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">they go next</text><line x1="259" y1="428" x2="271" y2="428" stroke="#D5DBD6" stroke-width="3" marker-end="url(#ah)"/><rect x="272" y="384" width="210" height="200" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="272" y="384" width="210" height="8" rx="4" fill="#1F6B45"/><circle cx="302" cy="428" r="18" fill="#1F6B45"/><text x="302" y="434" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="288" y="476" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Money and</text><text x="288" y="499" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">decision makers</text><text x="288" y="529" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Mortgage, liens, back</text><text x="288" y="548" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">taxes, who's on title</text><line x1="482" y1="428" x2="494" y2="428" stroke="#D5DBD6" stroke-width="3" marker-end="url(#ah)"/><rect x="495" y="384" width="210" height="200" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="495" y="384" width="210" height="8" rx="4" fill="#C77A1F"/><circle cx="525" cy="428" r="18" fill="#C77A1F"/><text x="525" y="434" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="511" y="476" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Price</text><text x="511" y="505" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Their number first,</text><text x="511" y="525" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">and how they got it</text><line x1="706" y1="428" x2="718" y2="428" stroke="#D5DBD6" stroke-width="3" marker-end="url(#ah)"/><rect x="719" y="384" width="210" height="200" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="719" y="384" width="210" height="8" rx="4" fill="#E2602A"/><circle cx="749" cy="428" r="18" fill="#E2602A"/><text x="749" y="434" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><text x="735" y="476" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Offer and</text><text x="735" y="499" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">negotiation</text><text x="735" y="529" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Frame, present, stay</text><text x="735" y="548" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">silent, handle</text><text x="735" y="568" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">objections</text><line x1="929" y1="428" x2="941" y2="428" stroke="#D5DBD6" stroke-width="3" marker-end="url(#ah)"/><rect x="942" y="384" width="210" height="200" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="942" y="384" width="210" height="8" rx="4" fill="#E2602A"/><circle cx="972" cy="428" r="18" fill="#E2602A"/><text x="972" y="434" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text><text x="958" y="476" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Close and next</text><text x="958" y="499" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">steps</text><text x="958" y="529" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Agreement sent on the</text><text x="958" y="548" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">phone, walkthrough set</text><rect x="48" y="618" width="18" height="18" rx="4" fill="#5B6B7A"/><text x="76" y="633" font-size="17" font-weight="600" fill="#2C3832" text-anchor="start">Open</text><rect x="148" y="618" width="18" height="18" rx="4" fill="#1F6B45"/><text x="176" y="633" font-size="17" font-weight="600" fill="#2C3832" text-anchor="start">Discovery</text><rect x="298" y="618" width="18" height="18" rx="4" fill="#C77A1F"/><text x="326" y="633" font-size="17" font-weight="600" fill="#2C3832" text-anchor="start">Price</text><rect x="408" y="618" width="18" height="18" rx="4" fill="#E2602A"/><text x="436" y="633" font-size="17" font-weight="600" fill="#2C3832" text-anchor="start">Offer and close</text><text x="48" y="670" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">Follow the stages in order: discovery before the offer, every time.</text></svg>