<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Lead status flow: new, attempting, contacted, qualified, appointment set, offer made, under contract; from any step a lead can move to nurture, dead or do-not-call.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="760" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">How a lead moves through the CRM</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">The main path, and the three places a lead can leave it.</text><rect x="48" y="150" width="240" height="92" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="66" y="188" font-size="22" font-weight="700" fill="#13211A" text-anchor="start">New</text><text x="66" y="218" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Call now</text><rect x="336" y="150" width="240" height="92" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="354" y="188" font-size="22" font-weight="700" fill="#13211A" text-anchor="start">Attempting</text><text x="354" y="218" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">First-week cadence</text><rect x="624" y="150" width="240" height="92" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="642" y="188" font-size="22" font-weight="700" fill="#13211A" text-anchor="start">Contacted</text><text x="642" y="218" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Finish the four pillars</text><rect x="912" y="150" width="240" height="92" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="930" y="188" font-size="22" font-weight="700" fill="#13211A" text-anchor="start">Qualified</text><text x="930" y="218" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Scored 7+: set appointment</text><rect x="912" y="320" width="240" height="92" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="930" y="358" font-size="22" font-weight="700" fill="#13211A" text-anchor="start">Appointment set</text><text x="930" y="388" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Reminder, then appointment</text><rect x="624" y="320" width="240" height="92" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="642" y="358" font-size="22" font-weight="700" fill="#13211A" text-anchor="start">Offer made</text><text x="642" y="388" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Follow-up ladder</text><rect x="336" y="320" width="240" height="92" rx="14" fill="#E3F1E8" stroke="#1F6B45" stroke-width="3"/><text x="354" y="358" font-size="22" font-weight="700" fill="#1F6B45" text-anchor="start">Under contract</text><text x="354" y="388" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Hands to TC and dispo</text><line x1="292" y1="196" x2="330" y2="196" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><line x1="580" y1="196" x2="618" y2="196" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><line x1="868" y1="196" x2="906" y2="196" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><line x1="1032" y1="246" x2="1032" y2="314" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><line x1="908" y1="366" x2="870" y2="366" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><line x1="620" y1="366" x2="582" y2="366" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><rect x="48" y="520" width="1104" height="170" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2" stroke-dasharray="8 6"/><text x="72" y="556" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">From any step, a lead can move to:</text><rect x="72" y="576" width="339" height="94" rx="10" fill="#E3F1E8" stroke="#E3F1E8" stroke-width="2"/><text x="88" y="606" font-size="19" font-weight="700" fill="#1F6B45" text-anchor="start">Nurture</text><text x="88" y="632" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Not now, maybe later. Monthly touch</text><text x="88" y="652" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">with a reason.</text><rect x="431" y="576" width="339" height="94" rx="10" fill="#EDEBE5" stroke="#EDEBE5" stroke-width="2"/><text x="447" y="606" font-size="19" font-weight="700" fill="#56635B" text-anchor="start">Dead</text><text x="447" y="632" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Not a fit, sold, or not the owner.</text><text x="447" y="652" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Always note why.</text><rect x="789" y="576" width="339" height="94" rx="10" fill="#FBE3E0" stroke="#FBE3E0" stroke-width="2"/><text x="805" y="606" font-size="19" font-weight="700" fill="#A3261D" text-anchor="start">Do-not-call</text><text x="805" y="632" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Asked not to be called. Never contact</text><text x="805" y="652" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">again.</text><text x="48" y="726" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">Every lead you touch gets a status and a dated next step before you move on.</text></svg>