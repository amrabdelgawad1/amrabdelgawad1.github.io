<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Certification path: pass modules 1 to 19 at 85%, the final exam at 85%, three role-plays (40+ each, one 45+), the compliance quiz at 90% and the capstone deal file; then certified for one year and renewed yearly.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="720" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">How certification works</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">Five requirements, then a yearly renewal.</text><rect x="48" y="150" width="640" height="82" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="92" cy="191" r="20" fill="#13211A"/><text x="92" y="197" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="130" y="186" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Modules 1 to 19</text><text x="130" y="212" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Every checkpoint passed at 85%</text><path d="M688 191.0 H738 V387.0 H788" fill="none" stroke="#D5DBD6" stroke-width="3" stroke-linejoin="round"/><rect x="48" y="248" width="640" height="82" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="92" cy="289" r="20" fill="#13211A"/><text x="92" y="295" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="130" y="284" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Final exam</text><text x="130" y="310" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">50 questions, passed at 85% (43 of 50)</text><path d="M688 289.0 H738 V387.0 H788" fill="none" stroke="#D5DBD6" stroke-width="3" stroke-linejoin="round"/><rect x="48" y="346" width="640" height="82" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="92" cy="387" r="20" fill="#13211A"/><text x="92" y="393" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="130" y="382" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Three role-plays</text><text x="130" y="408" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Each 40+ with no area below 3; at least one 45+</text><path d="M688 387.0 H738 V387.0 H788" fill="none" stroke="#D5DBD6" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="48" y="444" width="640" height="82" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="92" cy="485" r="20" fill="#13211A"/><text x="92" y="491" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="130" y="480" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Compliance quiz</text><text x="130" y="506" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Lesson 20.6, passed at 90%</text><path d="M688 485.0 H738 V387.0 H788" fill="none" stroke="#D5DBD6" stroke-width="3" stroke-linejoin="round"/><rect x="48" y="542" width="640" height="82" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="92" cy="583" r="20" fill="#13211A"/><text x="92" y="589" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="130" y="578" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Capstone deal file</text><text x="130" y="604" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">The Module 20 written drill, approved by Amr</text><path d="M688 583.0 H738 V387.0 H788" fill="none" stroke="#D5DBD6" stroke-width="3" stroke-linejoin="round"/><circle cx="948" cy="387.0" r="120" fill="#FBE6DA" stroke="#E2602A" stroke-width="4"/><text x="948" y="369" font-size="30" font-weight="700" fill="#B8461A" text-anchor="middle">Certified</text><text x="948" y="401" font-size="17" font-weight="600" fill="#2C3832" text-anchor="middle">Valid for one year</text><text x="948" y="427" font-size="15" font-weight="500" fill="#56635B" text-anchor="middle">Code checkable at /cert</text><path d="M948 511.0 V557.0" fill="none" stroke="#E2602A" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="818" y="563" width="260" height="92" rx="12" fill="#E3F1E8" stroke="#1F6B45" stroke-width="2"/><text x="948" y="597" font-size="18" font-weight="700" fill="#1F6B45" text-anchor="middle">Renew every year</text><text x="948" y="623" font-size="15" font-weight="500" fill="#2C3832" text-anchor="middle">A new scored call and the</text><text x="948" y="642" font-size="15" font-weight="500" fill="#2C3832" text-anchor="middle">law update</text><text x="48" y="660" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">Already on live calls? One real call (recorded with consent) scoring</text><text x="48" y="682" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">40+ can replace one of the three role-plays.</text></svg>