<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 704" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Objection system in three lengths: full six steps pause, acknowledge, clarify, isolate, respond, re-close; short four steps acknowledge, clarify, respond, advance; quick three steps acknowledge, ask, answer then check in.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="704" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">One objection system, three lengths</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">The same moves, trimmed for how much time you have.</text><text x="224" y="150" font-size="21" font-weight="700" fill="#E2602A" text-anchor="middle">Full (6 steps)</text><rect x="48" y="172" width="352" height="64" rx="12" fill="#FBE6DA" stroke="#E2602A" stroke-width="2"/><circle cx="80" cy="204" r="17" fill="#E2602A"/><text x="80" y="210" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="110" y="212" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Pause</text><rect x="48" y="250" width="352" height="64" rx="12" fill="#FBE6DA" stroke="#E2602A" stroke-width="2"/><circle cx="80" cy="282" r="17" fill="#E2602A"/><text x="80" y="288" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="110" y="290" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Acknowledge</text><line x1="224" y1="238" x2="224" y2="246" stroke="#E2602A" stroke-width="2" marker-end="url(#ah)"/><rect x="48" y="328" width="352" height="64" rx="12" fill="#FBE6DA" stroke="#E2602A" stroke-width="2"/><circle cx="80" cy="360" r="17" fill="#E2602A"/><text x="80" y="366" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="110" y="368" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Clarify</text><line x1="224" y1="316" x2="224" y2="324" stroke="#E2602A" stroke-width="2" marker-end="url(#ah)"/><rect x="48" y="406" width="352" height="64" rx="12" fill="#FBE6DA" stroke="#E2602A" stroke-width="2"/><circle cx="80" cy="438" r="17" fill="#E2602A"/><text x="80" y="444" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="110" y="446" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Isolate</text><line x1="224" y1="394" x2="224" y2="402" stroke="#E2602A" stroke-width="2" marker-end="url(#ah)"/><rect x="48" y="484" width="352" height="64" rx="12" fill="#FBE6DA" stroke="#E2602A" stroke-width="2"/><circle cx="80" cy="516" r="17" fill="#E2602A"/><text x="80" y="522" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="110" y="524" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Respond</text><line x1="224" y1="472" x2="224" y2="480" stroke="#E2602A" stroke-width="2" marker-end="url(#ah)"/><rect x="48" y="562" width="352" height="64" rx="12" fill="#FBE6DA" stroke="#E2602A" stroke-width="2"/><circle cx="80" cy="594" r="17" fill="#E2602A"/><text x="80" y="600" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="110" y="602" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Re-close</text><line x1="224" y1="550" x2="224" y2="558" stroke="#E2602A" stroke-width="2" marker-end="url(#ah)"/><text x="600" y="150" font-size="21" font-weight="700" fill="#C77A1F" text-anchor="middle">Short (4 steps)</text><rect x="424" y="250" width="352" height="64" rx="12" fill="#FBEBD3" stroke="#C77A1F" stroke-width="2"/><circle cx="456" cy="282" r="17" fill="#C77A1F"/><text x="456" y="288" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="486" y="290" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Acknowledge</text><rect x="424" y="328" width="352" height="64" rx="12" fill="#FBEBD3" stroke="#C77A1F" stroke-width="2"/><circle cx="456" cy="360" r="17" fill="#C77A1F"/><text x="456" y="366" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="486" y="368" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Clarify</text><line x1="600" y1="316" x2="600" y2="324" stroke="#C77A1F" stroke-width="2" marker-end="url(#ah)"/><rect x="424" y="484" width="352" height="64" rx="12" fill="#FBEBD3" stroke="#C77A1F" stroke-width="2"/><circle cx="456" cy="516" r="17" fill="#C77A1F"/><text x="456" y="522" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="486" y="524" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Respond</text><line x1="600" y1="394" x2="600" y2="480" stroke="#C77A1F" stroke-width="2" marker-end="url(#ah)"/><rect x="424" y="562" width="352" height="64" rx="12" fill="#FBEBD3" stroke="#C77A1F" stroke-width="2"/><circle cx="456" cy="594" r="17" fill="#C77A1F"/><text x="456" y="600" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="486" y="602" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Advance</text><line x1="600" y1="550" x2="600" y2="558" stroke="#C77A1F" stroke-width="2" marker-end="url(#ah)"/><text x="976" y="150" font-size="21" font-weight="700" fill="#1F6B45" text-anchor="middle">Quick (3 steps)</text><rect x="800" y="250" width="352" height="64" rx="12" fill="#E3F1E8" stroke="#1F6B45" stroke-width="2"/><circle cx="832" cy="282" r="17" fill="#1F6B45"/><text x="832" y="288" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="862" y="290" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Acknowledge</text><rect x="800" y="328" width="352" height="64" rx="12" fill="#E3F1E8" stroke="#1F6B45" stroke-width="2"/><circle cx="832" cy="360" r="17" fill="#1F6B45"/><text x="832" y="366" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="862" y="368" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Ask</text><line x1="976" y1="316" x2="976" y2="324" stroke="#1F6B45" stroke-width="2" marker-end="url(#ah)"/><rect x="800" y="484" width="352" height="64" rx="12" fill="#E3F1E8" stroke="#1F6B45" stroke-width="2"/><circle cx="832" cy="516" r="17" fill="#1F6B45"/><text x="832" y="522" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="862" y="524" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Answer, then check in</text><line x1="976" y1="394" x2="976" y2="480" stroke="#1F6B45" stroke-width="2" marker-end="url(#ah)"/><text x="48" y="670" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">Learn the full version; use the shorter ones when the moment is quick. Never say "but" right after you acknowledge.</text></svg>