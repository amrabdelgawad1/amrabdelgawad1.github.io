<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Time on a 30-minute call: open and rapport 10%, discovery and qualifying 45%, gap summary 5%, presenting the offer 20%, price, objections and close 20%.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="580" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">Where the time goes on a 30-minute call</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">Almost half the call is discovery.</text><text x="48" y="150" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">A 30-minute call</text><text x="1152" y="150" font-size="16" font-weight="500" fill="#56635B" text-anchor="end">30 min</text><rect x="48" y="170" width="107" height="80" rx="8" fill="#5B6B7A"/><text x="103" y="220" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">10%</text><rect x="158" y="170" width="494" height="80" rx="8" fill="#1F6B45"/><text x="407" y="220" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">45%</text><rect x="655" y="170" width="52" height="80" rx="8" fill="#7A8B5B"/><text x="683" y="220" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5%</text><rect x="710" y="170" width="218" height="80" rx="8" fill="#C77A1F"/><text x="821" y="220" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">20%</text><rect x="931" y="170" width="218" height="80" rx="8" fill="#E2602A"/><text x="1042" y="220" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">20%</text><rect x="48" y="272" width="22" height="22" rx="5" fill="#5B6B7A"/><text x="84" y="290" font-size="19" font-weight="600" fill="#13211A" text-anchor="start">Open, upfront agreement, rapport</text><text x="640" y="290" font-size="19" font-weight="700" fill="#5B6B7A" text-anchor="end">10%</text><text x="670" y="290" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">About 3 min</text><rect x="48" y="318" width="22" height="22" rx="5" fill="#1F6B45"/><text x="84" y="336" font-size="19" font-weight="600" fill="#13211A" text-anchor="start">Discovery and qualifying</text><text x="640" y="336" font-size="19" font-weight="700" fill="#1F6B45" text-anchor="end">45%</text><text x="670" y="336" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">13 to 14 min</text><rect x="48" y="364" width="22" height="22" rx="5" fill="#7A8B5B"/><text x="84" y="382" font-size="19" font-weight="600" fill="#13211A" text-anchor="start">Gap summary</text><text x="640" y="382" font-size="19" font-weight="700" fill="#7A8B5B" text-anchor="end">5%</text><text x="670" y="382" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">1 to 2 min</text><rect x="48" y="410" width="22" height="22" rx="5" fill="#C77A1F"/><text x="84" y="428" font-size="19" font-weight="600" fill="#13211A" text-anchor="start">Presenting the offer</text><text x="640" y="428" font-size="19" font-weight="700" fill="#C77A1F" text-anchor="end">20%</text><text x="670" y="428" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">About 6 min</text><rect x="48" y="456" width="22" height="22" rx="5" fill="#E2602A"/><text x="84" y="474" font-size="19" font-weight="600" fill="#13211A" text-anchor="start">Price, objections, close, next steps</text><text x="640" y="474" font-size="19" font-weight="700" fill="#E2602A" text-anchor="end">20%</text><text x="670" y="474" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">About 6 min</text><text x="48" y="540" font-size="20" font-weight="600" fill="#13211A" text-anchor="start">Top reps spend more time in discovery and less time pitching.</text></svg>