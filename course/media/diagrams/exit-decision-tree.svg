<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 888" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Exit decision tree: cash if there is equity at or under MAO; otherwise novation, subject-to, seller finance, or short sale, and if none fit, a scheduled follow-up or referral.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="888" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">Choosing the deal structure</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">Ask in order. The first "yes" is your exit.</text><rect x="48" y="140" width="640" height="84" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="84" cy="182" r="18" fill="#13211A"/><text x="84" y="188" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="116" y="176" font-size="18" font-weight="600" fill="#13211A" text-anchor="start">Enough equity for cash at or under MAO, and the</text><text x="116" y="199" font-size="18" font-weight="600" fill="#13211A" text-anchor="start">seller accepts?</text><line x1="692" y1="182" x2="772" y2="182" stroke="#1F6B45" stroke-width="3" marker-end="url(#ah)"/><text x="732" y="172" font-size="16" font-weight="700" fill="#1F6B45" text-anchor="middle">Yes</text><rect x="778" y="140" width="374" height="84" rx="14" fill="#E3F1E8" stroke="#1F6B45" stroke-width="2"/><text x="798" y="176" font-size="18" font-weight="700" fill="#1F6B45" text-anchor="start">Cash: wholesale assignment or</text><text x="798" y="199" font-size="18" font-weight="700" fill="#1F6B45" text-anchor="start">double close</text><line x1="84" y1="226" x2="84" y2="254" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><text x="98" y="248" font-size="16" font-weight="700" fill="#B8461A" text-anchor="start">No</text><rect x="48" y="258" width="640" height="84" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="84" cy="300" r="18" fill="#13211A"/><text x="84" y="306" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="116" y="294" font-size="18" font-weight="600" fill="#13211A" text-anchor="start">Seller wants more. Decent shape, and can wait 60 to</text><text x="116" y="317" font-size="18" font-weight="600" fill="#13211A" text-anchor="start">120 days?</text><line x1="692" y1="300" x2="772" y2="300" stroke="#1F6B45" stroke-width="3" marker-end="url(#ah)"/><text x="732" y="290" font-size="16" font-weight="700" fill="#1F6B45" text-anchor="middle">Yes</text><rect x="778" y="258" width="374" height="84" rx="14" fill="#E3F1E8" stroke="#1F6B45" stroke-width="2"/><text x="798" y="294" font-size="18" font-weight="700" fill="#1F6B45" text-anchor="start">Novation (a retail listing)</text><line x1="84" y1="344" x2="84" y2="372" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><text x="98" y="366" font-size="16" font-weight="700" fill="#B8461A" text-anchor="start">No</text><rect x="48" y="376" width="640" height="84" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="84" cy="418" r="18" fill="#13211A"/><text x="84" y="424" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="116" y="412" font-size="18" font-weight="600" fill="#13211A" text-anchor="start">Low equity. A good-rate mortgage with a payment</text><text x="116" y="435" font-size="18" font-weight="600" fill="#13211A" text-anchor="start">below market rent?</text><line x1="692" y1="418" x2="772" y2="418" stroke="#1F6B45" stroke-width="3" marker-end="url(#ah)"/><text x="732" y="408" font-size="16" font-weight="700" fill="#1F6B45" text-anchor="middle">Yes</text><rect x="778" y="376" width="374" height="84" rx="14" fill="#E3F1E8" stroke="#1F6B45" stroke-width="2"/><text x="798" y="412" font-size="18" font-weight="700" fill="#1F6B45" text-anchor="start">Subject-to</text><line x1="84" y1="462" x2="84" y2="490" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><text x="98" y="484" font-size="16" font-weight="700" fill="#B8461A" text-anchor="start">No</text><rect x="48" y="494" width="640" height="84" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="84" cy="536" r="18" fill="#13211A"/><text x="84" y="542" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="116" y="530" font-size="18" font-weight="600" fill="#13211A" text-anchor="start">Free and clear or high equity. Wants monthly income</text><text x="116" y="553" font-size="18" font-weight="600" fill="#13211A" text-anchor="start">or a tax spread?</text><line x1="692" y1="536" x2="772" y2="536" stroke="#1F6B45" stroke-width="3" marker-end="url(#ah)"/><text x="732" y="526" font-size="16" font-weight="700" fill="#1F6B45" text-anchor="middle">Yes</text><rect x="778" y="494" width="374" height="84" rx="14" fill="#E3F1E8" stroke="#1F6B45" stroke-width="2"/><text x="798" y="530" font-size="18" font-weight="700" fill="#1F6B45" text-anchor="start">Seller finance</text><line x1="84" y1="580" x2="84" y2="608" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><text x="98" y="602" font-size="16" font-weight="700" fill="#B8461A" text-anchor="start">No</text><rect x="48" y="612" width="640" height="84" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><circle cx="84" cy="654" r="18" fill="#13211A"/><text x="84" y="660" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="116" y="648" font-size="18" font-weight="600" fill="#13211A" text-anchor="start">Owes more than it's worth?</text><line x1="692" y1="654" x2="772" y2="654" stroke="#1F6B45" stroke-width="3" marker-end="url(#ah)"/><text x="732" y="644" font-size="16" font-weight="700" fill="#1F6B45" text-anchor="middle">Yes</text><rect x="778" y="612" width="374" height="84" rx="14" fill="#E3F1E8" stroke="#1F6B45" stroke-width="2"/><text x="798" y="648" font-size="18" font-weight="700" fill="#1F6B45" text-anchor="start">Short sale (lender approval) or</text><text x="798" y="671" font-size="18" font-weight="700" fill="#1F6B45" text-anchor="start">refer out</text><line x1="84" y1="698" x2="84" y2="726" stroke="#E2602A" stroke-width="3" marker-end="url(#ah)"/><text x="98" y="720" font-size="16" font-weight="700" fill="#B8461A" text-anchor="start">No</text><rect x="48" y="730" width="1104" height="84" rx="14" fill="#FBEBD3" stroke="#C77A1F" stroke-width="2"/><circle cx="84" cy="772" r="18" fill="#C77A1F"/><text x="84" y="778" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="116" y="766" font-size="18" font-weight="600" fill="#13211A" text-anchor="start">None fit: follow up with a scheduled date and a reason, or refer to an agent (a referral fee</text><text x="116" y="789" font-size="18" font-weight="600" fill="#13211A" text-anchor="start">only if licensed and legal).</text><text x="48" y="854" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">Each "No" moves you down to the next question.</text></svg>