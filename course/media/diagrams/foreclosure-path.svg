<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 691" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Foreclosure path: missed payments, the 120-day line, first filing, sale date set, auction, after the sale; judicial foreclosure is slower and goes through court, non-judicial is faster under a power of sale.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="691" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">The general path to foreclosure</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">Six steps, and the two ways a state can run them.</text><polygon points="48.0,140 205.66666666666666,140 223.66666666666666,242.5 205.66666666666666,345 48.0,345 48.0,242.5" fill="#FFFFFF" stroke="#5B6B7A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="88" cy="176" r="16" fill="#5B6B7A"/><text x="88" y="182" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="72" y="222" font-size="17" font-weight="700" fill="#13211A" text-anchor="start">Missed</text><text x="72" y="244" font-size="17" font-weight="700" fill="#13211A" text-anchor="start">payments</text><text x="72" y="270" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">Late fees, calls</text><text x="72" y="288" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">and letters</text><polygon points="233.66666666666666,140 391.3333333333333,140 409.3333333333333,242.5 391.3333333333333,345 233.66666666666666,345 251.66666666666666,242.5" fill="#FFFFFF" stroke="#5B6B7A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="274" cy="176" r="16" fill="#5B6B7A"/><text x="274" y="182" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="258" y="222" font-size="17" font-weight="700" fill="#13211A" text-anchor="start">The 120-day</text><text x="258" y="244" font-size="17" font-weight="700" fill="#13211A" text-anchor="start">line</text><text x="258" y="270" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">No first filing</text><text x="258" y="288" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">until 120+ days</text><text x="258" y="307" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">behind</text><polygon points="419.3333333333333,140 577.0,140 595.0,242.5 577.0,345 419.3333333333333,345 437.3333333333333,242.5" fill="#FFFFFF" stroke="#C77A1F" stroke-width="2.5" stroke-linejoin="round"/><circle cx="459" cy="176" r="16" fill="#C77A1F"/><text x="459" y="182" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="443" y="222" font-size="17" font-weight="700" fill="#13211A" text-anchor="start">First filing</text><text x="443" y="248" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">Lawsuit and lis</text><text x="443" y="266" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">pendens, or a</text><text x="443" y="284" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">notice of</text><text x="443" y="303" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">default/sale</text><polygon points="605.0,140 762.6666666666666,140 780.6666666666666,242.5 762.6666666666666,345 605.0,345 623.0,242.5" fill="#FFFFFF" stroke="#E2602A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="645" cy="176" r="16" fill="#E2602A"/><text x="645" y="182" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="629" y="222" font-size="17" font-weight="700" fill="#13211A" text-anchor="start">Sale date set</text><text x="629" y="248" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">Courthouse or</text><text x="629" y="266" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">online auction</text><polygon points="790.6666666666666,140 948.3333333333333,140 966.3333333333333,242.5 948.3333333333333,345 790.6666666666666,345 808.6666666666666,242.5" fill="#FFFFFF" stroke="#E2602A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="831" cy="176" r="16" fill="#E2602A"/><text x="831" y="182" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="815" y="222" font-size="17" font-weight="700" fill="#13211A" text-anchor="start">Auction</text><text x="815" y="248" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">Sold to a bidder,</text><text x="815" y="266" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">or back to the</text><text x="815" y="284" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">lender (REO)</text><polygon points="976.3333333333333,140 1134.0,140 1152.0,242.5 1134.0,345 976.3333333333333,345 994.3333333333333,242.5" fill="#FFFFFF" stroke="#E2602A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="1016" cy="176" r="16" fill="#E2602A"/><text x="1016" y="182" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="1000" y="222" font-size="17" font-weight="700" fill="#13211A" text-anchor="start">After the</text><text x="1000" y="244" font-size="17" font-weight="700" fill="#13211A" text-anchor="start">sale</text><text x="1000" y="270" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">Possible</text><text x="1000" y="288" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">redemption</text><text x="1000" y="307" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">period, then</text><text x="1000" y="325" font-size="14" font-weight="500" fill="#56635B" text-anchor="start">eviction</text><rect x="48" y="395" width="540" height="220" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="72" y="433" font-size="22" font-weight="700" fill="#1F6B45" text-anchor="start">Judicial</text><text x="72" y="459" font-size="16" font-weight="600" fill="#2C3832" text-anchor="start">The lender sues; a judge orders the sale</text><text x="72" y="495" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Slower: often many months to a few years. More time</text><text x="72" y="516" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">means more chances for you to help.</text><text x="72" y="571" font-size="15" font-weight="600" fill="#2C3832" text-anchor="start">Often cited: Florida, New York, New Jersey, Illinois,</text><text x="72" y="590" font-size="15" font-weight="600" fill="#2C3832" text-anchor="start">Ohio, Pennsylvania</text><rect x="612" y="395" width="540" height="220" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="636" y="433" font-size="22" font-weight="700" fill="#B8461A" text-anchor="start">Non-judicial</text><text x="636" y="459" font-size="16" font-weight="600" fill="#2C3832" text-anchor="start">A power-of-sale clause lets the trustee sell</text><text x="636" y="495" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Faster: a few months in some states. Timelines are</text><text x="636" y="516" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">short; act fast.</text><text x="636" y="571" font-size="15" font-weight="600" fill="#2C3832" text-anchor="start">Often cited: Texas, Georgia, California, Arizona</text><line x1="512" y1="351" x2="318" y2="389" stroke="#D5DBD6" stroke-width="3" marker-end="url(#ah)"/><line x1="512" y1="351" x2="882" y2="389" stroke="#D5DBD6" stroke-width="3" marker-end="url(#ah)"/><text x="48" y="655" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">Many states allow both, and each state has its own notice periods.</text></svg>