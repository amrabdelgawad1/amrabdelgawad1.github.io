<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Closing players: the title company or escrow in the center, surrounded by the transaction coordinator, closing attorney, underwriter, notary or mobile signer, and county recorder.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="800" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">Who is at the closing table</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">Title sits in the middle; everyone else feeds it.</text><line x1="486" y1="360" x2="364" y2="296" stroke="#D5DBD6" stroke-width="3"/><line x1="714" y1="360" x2="836" y2="296" stroke="#D5DBD6" stroke-width="3"/><line x1="720" y1="441" x2="848" y2="463" stroke="#D5DBD6" stroke-width="3"/><line x1="480" y1="441" x2="352" y2="463" stroke="#D5DBD6" stroke-width="3"/><line x1="600" y1="489" x2="600" y2="563" stroke="#D5DBD6" stroke-width="3"/><rect x="55" y="155" width="330" height="130" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="73" y="189" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Transaction coordinator</text><text x="73" y="217" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">On your team; tracks deadlines and</text><text x="73" y="236" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">documents. Your handoff point after</text><text x="73" y="256" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">the contract</text><rect x="815" y="155" width="330" height="130" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="833" y="189" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Closing attorney</text><text x="833" y="217" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Runs the closing or must be involved</text><text x="833" y="236" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">in some states</text><rect x="835" y="425" width="330" height="130" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="853" y="459" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Underwriter</text><text x="853" y="487" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">The insurer behind title; decides</text><text x="853" y="506" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">what risks they'll insure</text><rect x="35" y="425" width="330" height="130" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="53" y="459" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">Notary or mobile signer</text><text x="53" y="487" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Verifies ID, witnesses signatures;</text><text x="53" y="506" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">often at the seller's home</text><rect x="435" y="585" width="330" height="130" rx="14" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><text x="453" y="619" font-size="19" font-weight="700" fill="#13211A" text-anchor="start">County recorder</text><text x="453" y="647" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">Makes the deed public record. A deal</text><text x="453" y="666" font-size="15" font-weight="500" fill="#56635B" text-anchor="start">isn't done until it records</text><circle cx="600.0" cy="400" r="140" fill="#FBE6DA" stroke="#E2602A" stroke-width="3"/><text x="600" y="350" font-size="24" font-weight="700" fill="#B8461A" text-anchor="middle">Title company</text><text x="600" y="376" font-size="18" font-weight="600" fill="#B8461A" text-anchor="middle">or escrow</text><text x="600" y="410" font-size="15" font-weight="500" fill="#2C3832" text-anchor="middle">Searches records</text><text x="600" y="434" font-size="15" font-weight="500" fill="#2C3832" text-anchor="middle">Holds earnest money</text><text x="600" y="458" font-size="15" font-weight="500" fill="#2C3832" text-anchor="middle">Prepares the settlement</text><text x="600" y="482" font-size="15" font-weight="500" fill="#2C3832" text-anchor="middle">Sends money, records docs</text><text x="48" y="760" font-size="18" font-weight="500" fill="#56635B" text-anchor="start">Title is your most important partner. A slow or nervous title company kills deals.</text></svg>