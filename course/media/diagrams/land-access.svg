<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Land access ladder: public road frontage is best, then private road with a recorded agreement, recorded easement, physical path only (risky), and landlocked (big discount).</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="720" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">Land access, best to worst</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">How the parcel is reached sets much of its value.</text><rect x="48" y="140" width="1104" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="48" y="140" width="670" height="92" rx="12" fill="#E3F1E8"/><rect x="48" y="140" width="10" height="92" rx="5" fill="#1F6B45"/><text x="76" y="178" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Public road frontage</text><text x="76" y="206" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Touches a road the county or state maintains</text><text x="1128" y="192" font-size="17" font-weight="700" fill="#1F6B45" text-anchor="end">Best. Full value</text><rect x="48" y="244" width="1104" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="48" y="244" width="560" height="92" rx="12" fill="#EAF2E1"/><rect x="48" y="244" width="10" height="92" rx="5" fill="#5E8F3E"/><text x="76" y="282" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Private road with a recorded agreement</text><text x="76" y="310" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">Shared road, with rules for upkeep</text><text x="1128" y="296" font-size="17" font-weight="700" fill="#5E8F3E" text-anchor="end">Good; buyers ask who maintains it</text><rect x="48" y="348" width="1104" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="48" y="348" width="450" height="92" rx="12" fill="#FBEBD3"/><rect x="48" y="348" width="10" height="92" rx="5" fill="#C77A1F"/><text x="76" y="386" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Recorded easement</text><text x="76" y="414" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">A legal right to cross someone else's land</text><text x="1128" y="400" font-size="17" font-weight="700" fill="#C77A1F" text-anchor="end">Workable. Read width, use, who it's for</text><rect x="48" y="452" width="1104" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="48" y="452" width="340" height="92" rx="12" fill="#FBE6DA"/><rect x="48" y="452" width="10" height="92" rx="5" fill="#C4571F"/><text x="76" y="490" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Physical path only</text><text x="76" y="518" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">You can drive in, but no recorded right</text><text x="1128" y="504" font-size="17" font-weight="700" fill="#C4571F" text-anchor="end">Risky. Treat as landlocked until proven</text><rect x="48" y="556" width="1104" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBD6" stroke-width="2"/><rect x="48" y="556" width="230" height="92" rx="12" fill="#FBE3E0"/><rect x="48" y="556" width="10" height="92" rx="5" fill="#A3261D"/><text x="76" y="594" font-size="20" font-weight="700" fill="#13211A" text-anchor="start">Landlocked</text><text x="76" y="622" font-size="16" font-weight="500" fill="#56635B" text-anchor="start">No legal way in</text><text x="1128" y="608" font-size="17" font-weight="700" fill="#A3261D" text-anchor="end">Big discount; best buyer is often a neighbor</text><text x="48" y="686" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">Ask how they get to the land, then check the records. Sellers often believe in access that was never written down.</text></svg>