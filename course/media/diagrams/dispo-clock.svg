<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 748" role="img" aria-labelledby="t" font-family="Inter, Arial, Helvetica, sans-serif"><title id="t">Dispo clock: hand-off and underwriting on day 0 to 1, package by day 2, hot list then full blast days 2 to 3, showings days 3 to 6, offers days 5 to 7, assignment signed days 7 to 9, close day 10 to 30; inspection period often 7 to 14 days.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="748" fill="#F6F4EF"/><text x="48" y="64" font-size="34" font-weight="700" fill="#13211A" text-anchor="start">The dispo clock</text><text x="48" y="98" font-size="20" font-weight="500" fill="#56635B" text-anchor="start">From the signed contract to a locked buyer, inside the inspection period.</text><text x="300" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">0</text><line x1="300" y1="166" x2="300" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="360" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">1</text><line x1="360" y1="166" x2="360" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="420" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">2</text><line x1="420" y1="166" x2="420" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="480" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">3</text><line x1="480" y1="166" x2="480" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="540" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">4</text><line x1="540" y1="166" x2="540" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="600" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">5</text><line x1="600" y1="166" x2="600" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="660" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">6</text><line x1="660" y1="166" x2="660" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="720" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">7</text><line x1="720" y1="166" x2="720" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="780" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">8</text><line x1="780" y1="166" x2="780" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="840" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">9</text><line x1="840" y1="166" x2="840" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="900" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">10</text><line x1="900" y1="166" x2="900" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="960" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">11</text><line x1="960" y1="166" x2="960" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="1020" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">12</text><line x1="1020" y1="166" x2="1020" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="1080" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">13</text><line x1="1080" y1="166" x2="1080" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="1140" y="156" font-size="15" font-weight="600" fill="#56635B" text-anchor="middle">14</text><line x1="1140" y1="166" x2="1140" y2="638" stroke="#E7E3DA" stroke-width="1.5"/><text x="300" y="130" font-size="15" font-weight="700" fill="#56635B" text-anchor="start">Day</text><text x="48" y="194" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Hand-off</text><text x="48" y="214" font-size="13" font-weight="500" fill="#56635B" text-anchor="start"></text><rect x="300" y="178" width="21" height="26" rx="6" fill="#13211A"/><text x="333" y="197" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Contract, photos, notes, seller details, access</text><text x="48" y="246" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Underwrite</text><text x="48" y="266" font-size="13" font-weight="500" fill="#56635B" text-anchor="start"></text><rect x="300" y="230" width="60" height="26" rx="6" fill="#13211A"/><text x="372" y="249" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Check ARV, repairs, buyer pricing</text><text x="48" y="298" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Package</text><text x="48" y="318" font-size="13" font-weight="500" fill="#56635B" text-anchor="start"></text><rect x="360" y="282" width="60" height="26" rx="6" fill="#13211A"/><text x="432" y="301" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Photos, video, comps, repair list, deal sheet</text><text x="48" y="350" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Hot list</text><text x="48" y="370" font-size="13" font-weight="500" fill="#56635B" text-anchor="start"></text><rect x="420" y="334" width="30" height="26" rx="6" fill="#13211A"/><text x="462" y="353" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Call your top 5 to 10 buyers first</text><text x="48" y="402" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Full blast</text><text x="48" y="422" font-size="13" font-weight="500" fill="#56635B" text-anchor="start"></text><rect x="420" y="386" width="60" height="26" rx="6" fill="#13211A"/><text x="492" y="405" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Email, text, social posts</text><text x="48" y="454" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Showings</text><text x="48" y="474" font-size="13" font-weight="500" fill="#56635B" text-anchor="start"></text><rect x="480" y="438" width="180" height="26" rx="6" fill="#13211A"/><text x="672" y="457" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">One or two open-house windows</text><text x="48" y="506" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Offers in</text><text x="48" y="526" font-size="13" font-weight="500" fill="#56635B" text-anchor="start"></text><rect x="600" y="490" width="120" height="26" rx="6" fill="#13211A"/><text x="732" y="509" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Price, proof of funds, deposit, track record</text><text x="48" y="558" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Assignment signed</text><text x="48" y="578" font-size="13" font-weight="500" fill="#56635B" text-anchor="start"></text><rect x="720" y="542" width="120" height="26" rx="6" fill="#E2602A"/><text x="852" y="561" font-size="15" font-weight="500" fill="#2C3832" text-anchor="start">Deposit to title; the deal is locked</text><text x="48" y="610" font-size="18" font-weight="700" fill="#13211A" text-anchor="start">Close</text><text x="48" y="630" font-size="13" font-weight="500" fill="#56635B" text-anchor="start"></text><rect x="900" y="594" width="240" height="26" rx="6" fill="#1F6B45"/><line x1="1140" y1="607" x2="1170" y2="607" stroke="#1F6B45" stroke-width="3" marker-end="url(#ah)"/><text x="890" y="613" font-size="15" font-weight="500" fill="#2C3832" text-anchor="end">Day 10 to 30: title, buyer access, seller's move</text><line x1="720" y1="166" x2="720" y2="648" stroke="#B8461A" stroke-width="2" stroke-dasharray="6 5"/><line x1="1140" y1="166" x2="1140" y2="648" stroke="#B8461A" stroke-width="3"/><text x="720" y="672" font-size="15" font-weight="700" fill="#B8461A" text-anchor="middle">Inspection period often 7 to 14 days</text><text x="1140" y="672" font-size="15" font-weight="700" fill="#B8461A" text-anchor="end">Linda's ends day 14</text><text x="48" y="714" font-size="17" font-weight="500" fill="#56635B" text-anchor="start">Dispo needs a buyer, ideally with a non-refundable deposit, before the inspection period ends.</text></svg>