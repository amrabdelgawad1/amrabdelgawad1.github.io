<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: a window with its rotted frame and sill replaced and painted</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect width="1200" height="750" fill="#DCE3E7"/><rect x="300" y="90" width="600" height="560" fill="#F7F5EF" stroke="#C9C3B6" stroke-width="4"/><rect x="360" y="150" width="480" height="440" fill="#B9D3E6" stroke="#F7F5EF" stroke-width="18"/><line x1="600" y1="150" x2="600" y2="590" stroke="#F7F5EF" stroke-width="14"/><line x1="360" y1="370" x2="840" y2="370" stroke="#F7F5EF" stroke-width="14"/><rect x="280" y="640" width="640" height="34" fill="#EDEAE2" stroke="#C9C3B6" stroke-width="3"/><line x1="300" y1="400" x2="120" y2="300" stroke="#E2602A" stroke-width="3"/><circle cx="300" cy="400" r="7" fill="#E2602A"/><text class="l" x="130" y="294" text-anchor="start">Rotted wood cut out,</text><text class="s" x="130" y="322" text-anchor="start">new trim primed and painted</text><line x1="600" y1="657" x2="760" y2="720" stroke="#E2602A" stroke-width="3"/><circle cx="600" cy="657" r="7" fill="#E2602A"/><text class="l" x="770" y="714" text-anchor="start">Sloped sill sheds water</text><g><rect x="60" y="24" width="420" height="46" rx="23" fill="#2F7D4F"/><text x="90" y="56" style="font:700 24px Inter,Arial,sans-serif;fill:#fff">Typical repair: new trim</text></g></svg>