<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: a smooth painted ceiling after popcorn texture was removed</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect width="1200" height="750" fill="#F1EEE7"/><rect x="0" y="0" width="1200" height="300" fill="#FAF9F6"/><line x1="0" y1="300" x2="1200" y2="300" stroke="#DDD8CD" stroke-width="4"/><circle cx="600" cy="130" r="50" fill="#FFFFFF" stroke="#DDD8CD" stroke-width="4"/><line x1="600" y1="220" x2="760" y2="420" stroke="#E2602A" stroke-width="3"/><circle cx="600" cy="220" r="7" fill="#E2602A"/><text class="l" x="750" y="414" text-anchor="end">Smooth, painted ceiling</text><text class="s" x="750" y="442" text-anchor="end">Tested first; skim-coated or covered with drywall</text><g><rect x="60" y="24" width="510" height="46" rx="23" fill="#2F7D4F"/><text x="90" y="56" style="font:700 24px Inter,Arial,sans-serif;fill:#fff">Typical repair: smooth ceiling</text></g></svg>