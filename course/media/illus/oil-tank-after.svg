<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: the yard after the buried oil tank was removed and backfilled</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect width="1200" height="750" fill="#E7EEF2"/><rect y="250" width="1200" height="500" fill="#A88B6E"/><rect y="230" width="1200" height="30" fill="#9DB37E"/><rect x="80" y="70" width="330" height="185" fill="#EFE8DA"/><path d="M60,80 L245,0 L430,80 Z" fill="#5B5F66"/><rect x="520" y="430" width="440" height="190" rx="95" fill="#B89C7E" stroke="#9A8064" stroke-width="4" stroke-dasharray="14 10"/><line x1="740" y1="525" x2="420" y2="700" stroke="#E2602A" stroke-width="3"/><circle cx="740" cy="525" r="7" fill="#E2602A"/><text class="l" x="430" y="694" text-anchor="start">Tank removed, soil tested, area backfilled</text><line x1="700" y1="245" x2="760" y2="150" stroke="#E2602A" stroke-width="3"/><circle cx="700" cy="245" r="7" fill="#E2602A"/><text class="l" x="770" y="144" text-anchor="start">No fill or vent pipes left</text><g><rect x="60" y="24" width="345" height="46" rx="23" fill="#2F7D4F"/><text x="90" y="56" style="font:700 24px Inter,Arial,sans-serif;fill:#fff">After: tank removed</text></g></svg>