<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: the same wall after mold remediation and new drywall</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect x="120" y="70" width="960" height="560" fill="#ECE9E1"/><rect x="120" y="630" width="960" height="40" fill="#A9784A"/><rect x="200" y="470" width="420" height="160" fill="#F3F0E9" stroke="#D9D3C6" stroke-width="3" stroke-dasharray="10 8"/><line x1="410" y1="550" x2="520" y2="400" stroke="#E2602A" stroke-width="3"/><circle cx="410" cy="550" r="7" fill="#E2602A"/><text class="l" x="530" y="394" text-anchor="start">Damaged drywall cut out and replaced</text><text class="s" x="530" y="422" text-anchor="start">Leak fixed first</text><line x1="860" y1="170" x2="640" y2="120" stroke="#E2602A" stroke-width="3"/><circle cx="860" cy="170" r="7" fill="#E2602A"/><text class="l" x="630" y="114" text-anchor="end">Ceiling stain sealed and painted</text><g><rect x="60" y="24" width="315" height="46" rx="23" fill="#2F7D4F"/><text x="90" y="56" style="font:700 24px Inter,Arial,sans-serif;fill:#fff">After: remediated</text></g></svg>