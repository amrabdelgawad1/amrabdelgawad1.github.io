<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: a house whose roof ridge sags in the middle</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect width="1200" height="750" fill="#E7EEF2"/><rect y="600" width="1200" height="150" fill="#9DB37E"/><rect x="230" y="380" width="740" height="230" fill="#E9E1D3"/><path d="M190,390 L360,190 Q600,250 840,190 L1010,390 Z" fill="#5B5F66"/><path d="M360,190 L840,190" stroke="#56635B" stroke-width="3" stroke-dasharray="10 8"/><rect x="300" y="450" width="110" height="90" fill="#FFFFFF" stroke="#13211A" stroke-width="3"/><rect x="790" y="450" width="110" height="90" fill="#FFFFFF" stroke="#13211A" stroke-width="3"/><rect x="545" y="460" width="100" height="150" fill="#A9784A"/><line x1="600" y1="222" x2="640" y2="110" stroke="#E2602A" stroke-width="3"/><circle cx="600" cy="222" r="7" fill="#E2602A"/><text class="l" x="630" y="104" text-anchor="end">Ridge dips in the middle</text><text class="s" x="630" y="132" text-anchor="end">Dashed line shows where a straight ridge would be</text><text class="t" x="80" y="700">Visible from the street or on Google Street View</text></svg>