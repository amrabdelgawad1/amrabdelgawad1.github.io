<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: aluminum branch wiring compared with copper wiring at an outlet</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect x="120" y="120" width="440" height="520" rx="10" fill="#FFFFFF" stroke="#D6D2C9" stroke-width="3"/><rect x="260" y="200" width="160" height="300" rx="16" fill="#F2EFE8" stroke="#BDB7AB" stroke-width="4"/><rect x="300" y="250" width="80" height="80" rx="10" fill="#E3DED3"/><rect x="300" y="380" width="80" height="80" rx="10" fill="#E3DED3"/><path d="M430,300 C520,300 560,360 640,360 L1060,360" stroke="#A9B1B8" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M430,410 C520,410 560,470 640,470 L1060,470" stroke="#C78B5A" stroke-width="16" fill="none" stroke-linecap="round"/><line x1="820" y1="360" x2="760" y2="230" stroke="#E2602A" stroke-width="3"/><circle cx="820" cy="360" r="7" fill="#E2602A"/><text class="l" x="770" y="224" text-anchor="start">Aluminum: dull silver wire</text><text class="s" x="770" y="252" text-anchor="start">Cable may be marked "AL"</text><line x1="820" y1="470" x2="760" y2="580" stroke="#E2602A" stroke-width="3"/><circle cx="820" cy="470" r="7" fill="#E2602A"/><text class="l" x="770" y="574" text-anchor="start">Copper: orange-brown wire</text><text class="s" x="770" y="602" text-anchor="start">What it should be</text><text class="t" x="80" y="710">Common in 1965 to 1973 homes: connections can overheat</text></svg>