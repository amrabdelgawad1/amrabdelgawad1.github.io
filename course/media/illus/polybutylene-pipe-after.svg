<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: polybutylene replaced with red and blue PEX water lines</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><line x1="120" y1="260" x2="1080" y2="260" stroke="#9A3129" stroke-width="46" stroke-linecap="round"/><line x1="120" y1="260" x2="1080" y2="260" stroke="#C9453A" stroke-width="40" stroke-linecap="round"/><line x1="120" y1="430" x2="1080" y2="430" stroke="#2B5688" stroke-width="46" stroke-linecap="round"/><line x1="120" y1="430" x2="1080" y2="430" stroke="#3C73B8" stroke-width="40" stroke-linecap="round"/><rect x="346" y="236" width="68" height="48" rx="8" fill="#C7A55B" stroke="#957A3F" stroke-width="4"/><rect x="346" y="406" width="68" height="48" rx="8" fill="#C7A55B" stroke="#957A3F" stroke-width="4"/><rect x="786" y="236" width="68" height="48" rx="8" fill="#C7A55B" stroke="#957A3F" stroke-width="4"/><rect x="786" y="406" width="68" height="48" rx="8" fill="#C7A55B" stroke="#957A3F" stroke-width="4"/><line x1="700" y1="260" x2="640" y2="130" stroke="#E2602A" stroke-width="3"/><circle cx="700" cy="260" r="7" fill="#E2602A"/><text class="l" x="650" y="124" text-anchor="start">Red PEX: hot water</text><line x1="700" y1="430" x2="640" y2="560" stroke="#E2602A" stroke-width="3"/><circle cx="700" cy="430" r="7" fill="#E2602A"/><text class="l" x="650" y="554" text-anchor="start">Blue PEX: cold water</text><g><rect x="60" y="24" width="375" height="46" rx="23" fill="#2F7D4F"/><text x="90" y="56" style="font:700 24px Inter,Arial,sans-serif;fill:#fff">After: repiped in PEX</text></g></svg>