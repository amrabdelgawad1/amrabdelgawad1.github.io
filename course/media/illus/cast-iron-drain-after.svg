<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: a cast iron drain replaced with a white PVC drain stack</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect width="1200" height="750" fill="#E7E6E1"/><rect x="0" y="0" width="1200" height="120" fill="#CFC9BE"/><rect x="560" y="120" width="70" height="520" fill="#F4F4F2" stroke="#B9BDC1" stroke-width="4"/><rect x="545" y="300" width="100" height="40" rx="6" fill="#E8E9EA" stroke="#B9BDC1" stroke-width="3"/><rect x="545" y="500" width="100" height="40" rx="6" fill="#E8E9EA" stroke="#B9BDC1" stroke-width="3"/><path d="M630,560 L900,560" stroke="#F4F4F2" stroke-width="60"/><path d="M630,560 L900,560" stroke="#B9BDC1" stroke-width="3"/><line x1="595" y1="320" x2="300" y2="260" stroke="#E2602A" stroke-width="3"/><circle cx="595" cy="320" r="7" fill="#E2602A"/><text class="l" x="310" y="254" text-anchor="start">White PVC drain stack</text><text class="s" x="310" y="282" text-anchor="start">Joined with glued fittings</text><line x1="800" y1="560" x2="860" y2="440" stroke="#E2602A" stroke-width="3"/><circle cx="800" cy="560" r="7" fill="#E2602A"/><text class="l" x="850" y="434" text-anchor="end">Smooth inside: no rust or scale</text><g><rect x="60" y="24" width="435" height="46" rx="23" fill="#2F7D4F"/><text x="90" y="56" style="font:700 24px Inter,Arial,sans-serif;fill:#fff">Typical repair: PVC drain</text></g></svg>