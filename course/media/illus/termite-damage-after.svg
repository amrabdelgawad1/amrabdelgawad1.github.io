<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: termite-damaged framing replaced with a pressure-treated sill plate</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect width="1200" height="750" fill="#E7E2D8"/><rect x="0" y="560" width="1200" height="190" fill="#A3A09A"/><rect x="80" y="470" width="1040" height="90" fill="#7FA36E" stroke="#5E7F50" stroke-width="3"/><rect x="120" y="120" width="44" height="350" fill="#D7B07A" stroke="#A9784A" stroke-width="3"/><rect x="260" y="120" width="44" height="350" fill="#D7B07A" stroke="#A9784A" stroke-width="3"/><rect x="400" y="120" width="44" height="350" fill="#D7B07A" stroke="#A9784A" stroke-width="3"/><rect x="540" y="120" width="44" height="350" fill="#D7B07A" stroke="#A9784A" stroke-width="3"/><rect x="680" y="120" width="44" height="350" fill="#D7B07A" stroke="#A9784A" stroke-width="3"/><rect x="820" y="120" width="44" height="350" fill="#D7B07A" stroke="#A9784A" stroke-width="3"/><rect x="960" y="120" width="44" height="350" fill="#D7B07A" stroke="#A9784A" stroke-width="3"/><line x1="600" y1="515" x2="760" y2="650" stroke="#E2602A" stroke-width="3"/><circle cx="600" cy="515" r="7" fill="#E2602A"/><text class="l" x="750" y="644" text-anchor="end">Treated sill plate replaces the damaged wood</text><text class="s" x="750" y="672" text-anchor="end">Green tint: pressure-treated lumber</text><line x1="400" y1="300" x2="300" y2="200" stroke="#E2602A" stroke-width="3"/><circle cx="400" cy="300" r="7" fill="#E2602A"/><text class="l" x="310" y="194" text-anchor="start">Termite treatment and</text><text class="s" x="310" y="222" te