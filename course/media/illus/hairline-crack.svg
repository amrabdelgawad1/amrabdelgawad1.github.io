<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: hairline vertical crack in a poured concrete foundation wall</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect x="150" y="90" width="900" height="520" rx="6" fill="#C9C6BE"/><circle cx="260" cy="150" r="9" fill="#B7B3AA"/><circle cx="430" cy="530" r="9" fill="#B7B3AA"/><circle cx="600" cy="150" r="9" fill="#B7B3AA"/><circle cx="770" cy="530" r="9" fill="#B7B3AA"/><circle cx="940" cy="150" r="9" fill="#B7B3AA"/><path d="M560,95 L566,190 L557,280 L570,370 L562,460 L571,560 L566,605" fill="none" stroke="#13211A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="150" y="610" width="900" height="60" fill="#8C6E52"/><line x1="566" y1="330" x2="760" y2="290" stroke="#E2602A" stroke-width="3"/><circle cx="566" cy="330" r="7" fill="#E2602A"/><text class="l" x="750" y="284" text-anchor="end">Hairline vertical crack</text><text class="s" x="750" y="312" text-anchor="end">Thinner than a credit card, no offset</text><line x1="560" y1="600" x2="760" y2="520" stroke="#E2602A" stroke-width="3"/><circle cx="560" cy="600" r="7" fill="#E2602A"/><text class="l" x="770" y="514" text-anchor="start">Even width top to bottom</text><text class="s" x="770" y="542" text-anchor="start">Usually shrinkage: seal and watch</text></svg>