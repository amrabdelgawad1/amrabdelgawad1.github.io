<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: corroded galvanized steel water pipe with a rust-narrowed cross section</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><line x1="120" y1="300" x2="1080" y2="300" stroke="#6F7678" stroke-width="66" stroke-linecap="round"/><line x1="120" y1="300" x2="1080" y2="300" stroke="#9BA1A3" stroke-width="60" stroke-linecap="round"/><rect x="560" y="255" width="90" height="90" rx="8" fill="#868D90" stroke="#6F7678" stroke-width="4"/><line x1="590" y1="258" x2="590" y2="342" stroke="#6F7678" stroke-width="3"/><line x1="610" y1="258" x2="610" y2="342" stroke="#6F7678" stroke-width="3"/><line x1="630" y1="258" x2="630" y2="342" stroke="#6F7678" stroke-width="3"/><circle cx="505" cy="320" r="16" fill="#B5652E"/><circle cx="700" cy="285" r="12" fill="#B5652E"/><circle cx="720" cy="312" r="9" fill="#9C4F22"/><g transform="translate(360,450)"><circle r="120" fill="#6F7678"/><circle r="98" fill="#9BA1A3"/><circle r="78" fill="#B5652E"/><circle r="34" fill="#F6F4EF"/></g><line x1="505" y1="320" x2="120" y2="170" stroke="#E2602A" stroke-width="3"/><circle cx="505" cy="320" r="7" fill="#E2602A"/><text class="l" x="130" y="164" text-anchor="start">Rust at joints and threads</text><line x1="360" y1="450" x2="620" y2="520" stroke="#E2602A" stroke-width="3"/><circle cx="360" cy="450" r="7" fill="#E2602A"/><text class="l" x="630" y="514" text-anchor="start">Cut end: rust narrows the opening</text><text class="s" x="630" y="542" text-anchor="start">Low water pressure, rusty water</text><text class="t" x="80" y="710">Gray, threaded fittings: common before 1960, usually replaced</text></svg>