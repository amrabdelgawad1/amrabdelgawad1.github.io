<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: aluminum wiring made safe with copper pigtails and rated connectors</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect x="120" y="120" width="440" height="520" rx="10" fill="#FFFFFF" stroke="#D6D2C9" stroke-width="3"/><rect x="260" y="200" width="160" height="300" rx="16" fill="#F2EFE8" stroke="#BDB7AB" stroke-width="4"/><rect x="300" y="250" width="80" height="80" rx="10" fill="#E3DED3"/><rect x="300" y="380" width="80" height="80" rx="10" fill="#E3DED3"/><path d="M430,300 C520,300 560,330 600,330" stroke="#C78B5A" stroke-width="16" fill="none" stroke-linecap="round"/><rect x="600" y="305" width="70" height="50" rx="12" fill="#6C7F93"/><path d="M670,330 L1060,330" stroke="#A9B1B8" stroke-width="16" stroke-linecap="round"/><line x1="635" y1="330" x2="700" y2="220" stroke="#E2602A" stroke-width="3"/><circle cx="635" cy="330" r="7" fill="#E2602A"/><text class="l" x="710" y="214" text-anchor="start">Copper pigtail</text><text class="s" x="710" y="242" text-anchor="start">AL/CU-rated connector</text><line x1="900" y1="330" x2="760" y2="470" stroke="#E2602A" stroke-width="3"/><circle cx="900" cy="330" r="7" fill="#E2602A"/><text class="l" x="750" y="464" text-anchor="end">Or rewire the circuit in copper</text><g><rect x="60" y="24" width="300" height="46" rx="23" fill="#2F7D4F"/><text x="90" y="56" style="font:700 24px Inter,Arial,sans-serif;fill:#fff">After: pigtailed</text></g></svg>