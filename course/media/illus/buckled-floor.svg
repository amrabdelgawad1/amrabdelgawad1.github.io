idth="3"/><line x1="520" y1="300" x2="760" y2="160" stroke="#E2602A" stroke-width="3"/><circle cx="520" cy="300" r="7" fill="#E2602A"/><text class="l" x="750" y="154" text-anchor="end">Boards cup and lift ("crowning")</text><text class="s" x="750" y="182" text-anchor="end">Wood swells when it soaks up water</text><text class="t" x="80" y="725">Find the water source first: pipe, appliance or wet crawl space</text></svg>