<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: a stucco wall after a crack was filled, textured and painted</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect width="1200" height="750" fill="#E8DFCF"/><path d="M420,160 C520,230 560,330 520,420 C500,480 560,540 640,600" stroke="#DED3BF" stroke-width="40" fill="none" stroke-linecap="round"/><line x1="530" y1="400" x2="700" y2="300" stroke="#E2602A" stroke-width="3"/><circle cx="530" cy="400" r="7" fill="#E2602A"/><text class="l" x="690" y="294" text-anchor="end">Crack routed, filled and re-textured</text><text class="s" x="690" y="322" text-anchor="end">Then painted to match</text><g><rect x="60" y="24" width="510" height="46" rx="23" fill="#2F7D4F"/><text x="90" y="56" style="font:700 24px Inter,Arial,sans-serif;fill:#fff">Typical repair: patched stucco</text></g></svg>