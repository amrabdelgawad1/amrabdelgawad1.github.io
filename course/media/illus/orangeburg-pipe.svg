<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: an Orangeburg fiber sewer pipe that has deformed underground</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect width="1200" height="750" fill="#A88B6E"/><rect width="1200" height="140" fill="#9DB37E"/><path d="M80,380 L380,380 Q520,380 600,420 Q680,460 820,450 L1120,450" stroke="#2E2A26" stroke-width="80" fill="none"/><path d="M560,395 Q600,440 640,410" stroke="#A88B6E" stroke-width="30" fill="none"/><line x1="600" y1="420" x2="660" y2="250" stroke="#E2602A" stroke-width="3"/><circle cx="600" cy="420" r="7" fill="#E2602A"/><text class="l" x="650" y="244" text-anchor="end">Pipe flattens and loses its round shape</text><text class="s" x="650" y="272" text-anchor="end">Roots get in at the soft spots</text><line x1="200" y1="380" x2="120" y2="560" stroke="#E2602A" stroke-width="3"/><circle cx="200" cy="380" r="7" fill="#E2602A"/><text class="l" x="130" y="554" text-anchor="start">Orangeburg: black, tar-soaked wood fiber pipe</text><text class="t" x="80" y="710">Sewer lines from about 1945 to 1972: scope the line before closing</text></svg>