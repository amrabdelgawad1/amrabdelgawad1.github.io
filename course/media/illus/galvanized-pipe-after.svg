<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: galvanized supply pipe replaced with copper, full inside diameter</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><line x1="120" y1="300" x2="1080" y2="300" stroke="#9C5A2C" stroke-width="50" stroke-linecap="round"/><line x1="120" y1="300" x2="1080" y2="300" stroke="#C47A45" stroke-width="44" stroke-linecap="round"/><rect x="560" y="268" width="80" height="64" rx="8" fill="#D08A55" stroke="#9C5A2C" stroke-width="4"/><g transform="translate(360,470)"><circle r="120" fill="#9C5A2C"/><circle r="100" fill="#C47A45"/><circle r="84" fill="#F6F4EF"/></g><line x1="800" y1="300" x2="760" y2="170" stroke="#E2602A" stroke-width="3"/><circle cx="800" cy="300" r="7" fill="#E2602A"/><text class="l" x="750" y="164" text-anchor="end">Copper or PEX replaces the old line</text><line x1="360" y1="470" x2="620" y2="520" stroke="#E2602A" stroke-width="3"/><circle cx="360" cy="470" r="7" fill="#E2602A"/><text class="l" x="630" y="514" text-anchor="start">Full opening, full water pressure</text><g><rect x="60" y="24" width="270" height="46" rx="23" fill="#2F7D4F"/><text x="90" y="56" style="font:700 24px Inter,Arial,sans-serif;fill:#fff">After: repiped</text></g></svg>