<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t"><title id="t">Illustration: a clean ceiling after the leak was fixed and the stain painted over</title><rect width="1200" height="750" fill="#F6F4EF"/><style>.l{font:600 26px Inter,Arial,sans-serif;fill:#13211A;paint-order:stroke;stroke:#F6F4EF;stroke-width:7px;stroke-linejoin:round}.s{font:500 21px Inter,Arial,sans-serif;fill:#56635B;paint-order:stroke;stroke:#F6F4EF;stroke-width:6px;stroke-linejoin:round}.t{font:700 30px Inter,Arial,sans-serif;fill:#13211A}</style><rect width="1200" height="750" fill="#F1EEE7"/><rect x="0" y="0" width="1200" height="360" fill="#FAF9F6"/><line x1="0" y1="360" x2="1200" y2="360" stroke="#DDD8CD" stroke-width="4"/><line x1="560" y1="180" x2="760" y2="470" stroke="#E2602A" stroke-width="3"/><circle cx="560" cy="180" r="7" fill="#E2602A"/><text class="l" x="750" y="464" text-anchor="end">Leak fixed, stain-blocking primer, fresh paint</text><text class="s" x="750" y="492" text-anchor="end">Soft or sagging drywall gets replaced</text><g><rect x="60" y="24" width="540" height="46" rx="23" fill="#2F7D4F"/><text x="90" y="56" style="font:700 24px Inter,Arial,sans-serif;fill:#fff">Typical repair: ceiling restored</text></g></svg>