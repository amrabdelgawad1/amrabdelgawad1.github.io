<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Team Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../style.css?v=7">
<style>
  .btn[aria-busy="true"]{ opacity:.6; pointer-events:none; }
  .notice{ padding:16px 20px; margin-bottom:20px; border-radius:var(--radius); border:1px solid rgba(255,107,107,.35); background:rgba(255,107,107,.07); color:#ffb0b0; font-size:14.5px; }
  .loading td{ text-align:center; color:var(--muted); padding:30px 0; }

  .page{ position:relative; min-height:100vh; padding:56px 0 120px; overflow:hidden; }
  .glow{ position:absolute; width:640px; height:640px; border-radius:50%; filter:blur(120px); pointer-events:none; }
  .glow-a{ top:-260px; left:50%; transform:translateX(-50%); background:var(--accent); opacity:.2; }
  .glow-b{ bottom:-280px; left:-200px; background:#6d4bff; opacity:.1; }
  .wrap{ position:relative; z-index:3; }
  [hidden]{ display:none !important; }

  .t-card{ background:linear-gradient(160deg, var(--bg3), var(--bg2)); border:1px solid var(--border2); border-radius:var(--radius-lg); box-shadow:0 30px 80px -30px rgba(0,0,0,.6); }
  .label{ display:block; font-size:12.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .field{ width:100%; background:var(--bg); border:1px solid var(--border2); border-radius:var(--radius-sm); color:var(--text); font:500 15px var(--font-body); padding:13px 14px; transition:border-color .25s, box-shadow .25s; color-scheme:dark; }
  .field:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-dim); }

  /* Login */
  .login{ max-width:420px; margin:9vh auto 0; padding:40px 36px; text-align:center; animation:up .7s cubic-bezier(.16,1,.3,1); }
  @keyframes up{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
  .lock-badge{ width:56px; height:56px; margin:0 auto 18px; border-radius:16px; display:grid; place-items:center; background:var(--accent-dim); border:1px solid var(--border2); color:var(--accent2); }
  .login h1{ font-size:32px; margin-bottom:6px; }
  .login .sub{ color:var(--light); font-size:15px; margin-bottom:28px; }
  .login form{ text-align:left; display:grid; gap:16px; }
  .login .btn{ width:100%; margin-top:6px; }
  .login-err{ color:#ff7a7a; font-size:13.5px; min-height:18px; }
  .login-foot{ font-size:12.5px; color:var(--muted); margin-top:20px; }

  /* Dashboard */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:40px; flex-wrap:wrap; }
  .topbar .brand{ font-size:21px; }
  .who-pill{ display:flex; align-items:center; gap:12px; font-size:13.5px; color:var(--light); }
  .who-pill .me{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:#fff; font-weight:700; font-size:12.5px; }
  .head{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:28px; }
  .head .section-heading{ margin-bottom:0; }
  .tools{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .seg{ display:inline-flex; padding:4px; border:1px solid var(--border2); border-radius:999px; background:rgba(7,9,15,.5); }
  .seg button{ border:0; background:transparent; color:var(--light); font:600 13px var(--font-body); padding:8px 14px; border-radius:999px; cursor:pointer; transition:background .25s, color .25s; }
  .seg button.on{ background:var(--accent); color:#fff; }
  .sel{ background:var(--bg); border:1px solid var(--border2); color:var(--text); border-radius:999px; padding:10px 16px; font:500 13.5px var(--font-body); color-scheme:dark; }

  .custom-range{ display:grid; grid-template-columns:180px auto 180px 1fr; gap:16px; align-items:end; padding:20px 24px; margin-bottom:20px; animation:up .5s cubic-bezier(.16,1,.3,1); }
  .custom-range .arrow{ color:var(--muted); padding-bottom:13px; }
  .custom-range .field{ padding:11px 12px; }
  .quick{ justify-self:end; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chips button{ border:1px solid var(--border2); background:transparent; color:var(--light); font:500 13px var(--font-body); padding:9px 13px; border-radius:999px; cursor:pointer; transition:border-color .2s, color .2s, background .2s; }
  .chips button:hover{ border-color:var(--accent2); color:var(--text); background:var(--accent-dim); }
  .range-err{ grid-column:1 / -1; color:#ff7a7a; font-size:13.5px; margin-top:-4px; }
  .range-err:empty{ display:none; }
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
  .stat{ padding:20px 22px; border-radius:var(--radius); }
  .stat p{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-weight:600; }
  .stat strong{ display:block; font:600 26px "JetBrains Mono", monospace; color:var(--white); margin-top:8px; white-space:nowrap; }
  .stat.w strong{ color:var(--green); } .stat.b strong{ color:var(--gold); }

  .people{ padding:28px 32px; margin-bottom:24px; }
  .card-title{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px; }
  .card-title h2{ font-size:24px; }
  .card-title span{ font-size:13px; color:var(--muted); }
  .person{ display:grid; grid-template-columns:200px 1fr 150px; gap:20px; align-items:center; padding:12px 0; }
  .person + .person{ border-top:1px solid var(--border); }
  .pname{ display:flex; align-items:center; gap:12px; font-weight:500; min-width:0; }
  .pname span:last-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .av{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:12.5px; font-weight:700; background:var(--accent-dim); color:var(--accent2); border:1px solid var(--border2); flex-shrink:0; }
  .pbar{ height:10px; border-radius:999px; background:var(--bg); border:1px solid var(--border); display:flex; overflow:hidden; }
  .pbar i{ display:block; height:100%; width:0; transition:width .9s cubic-bezier(.16,1,.3,1); }
  .pbar .w{ background:var(--green); } .pbar .b{ background:var(--gold); }
  .pnums{ text-align:right; font-family:"JetBrains Mono", monospace; font-size:14px; }
  .pnums small{ display:block; color:var(--muted); font-family:var(--font-body); font-size:12px; }

  .history{ padding:28px 32px; }
  table.log{ width:100%; border-collapse:collapse; font-size:14.5px; }
  table.log th{ text-align:left; font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:0 12px 12px; border-bottom:1px solid var(--border); }
  table.log td{ padding:15px 12px; border-bottom:1px solid var(--border); }
  table.log tr:last-child td{ border-bottom:none; }
  table.log tbody tr{ transition:background .2s, opacity .3s; }
  table.log tbody tr:hover{ background:rgba(59,123,255,.04); }
  .who{ display:flex; align-items:center; gap:12px; font-weight:500; }
  .num{ font-family:"JetBrains Mono", monospace; font-weight:500; white-space:nowrap; }
  .num.w{ color:var(--green); } .num.b{ color:var(--gold); }
  .muted{ color:var(--muted); }
  .new{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--green); background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); border-radius:999px; padding:2px 8px; }
  .del{ border:1px solid transparent; background:transparent; color:var(--muted); width:32px; height:32px; border-radius:8px; cursor:pointer; display:grid; place-items:center; transition:color .2s, border-color .2s, background .2s; }
  .del:hover{ color:#ff8a8a; border-color:rgba(255,107,107,.35); background:rgba(255,107,107,.07); }
  .del svg{ width:16px; height:16px; }
  .empty{ text-align:center; color:var(--muted); padding:30px 0; }
  .toast{ position:fixed; left:50%; bottom:28px; transform:translate(-50%, 20px); opacity:0; background:var(--bg4); border:1px solid var(--border2); color:var(--text); padding:12px 18px; border-radius:999px; font-size:14px; transition:opacity .3s, transform .3s; z-index:80; display:flex; gap:12px; align-items:center; }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .toast button{ background:none; border:0; color:var(--accent2); font:600 14px var(--font-body); cursor:pointer; }

  @media (max-width:860px){
    .stats{ grid-template-columns:repeat(2,1fr); }
    .custom-range{ grid-template-columns:1fr auto 1fr; }
    .quick{ grid-column:1 / -1; justify-self:stretch; }
    .person{ grid-template-columns:1fr auto; }
    .pbar{ grid-column:1 / -1; grid-row:2; }
  }
  @media (max-width:640px){
    .login{ padding:32px 22px; }
    .seg{ width:100%; } .seg button{ flex:1; padding:8px 4px; font-size:12.5px; white-space:nowrap; }
    .custom-range{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; padding:18px; }
    .custom-range label{ min-width:0; }
    .custom-range .field{ min-width:0; padding:10px 8px; font-size:14px; }
    .custom-range .arrow{ display:none; }
    .people, .history{ padding:22px 18px; }
    .stat strong{ font-size:21px; }
    table.log thead{ display:none; }
    table.log, table.log tbody{ display:block; }
    table.log tbody tr{ display:grid; grid-template-columns:1fr auto; gap:6px 12px; padding:14px 0; border-bottom:1px solid var(--border); }
    table.log tbody tr:last-child{ border-bottom:none; }
    table.log td{ padding:0; border:0; }
    table.log td:nth-child(1){ grid-column:1; grid-row:1; }
    table.log td:nth-child(6){ grid-column:2; grid-row:1; justify-self:end; }
    table.log td:nth-child(2){ grid-column:1 / -1; font-size:13.5px; }
    table.log td:nth-child(5){ display:none; }
    table.log td:nth-child(3), table.log td:nth-child(4){ display:inline-block; font-size:14px; }
    table.log td:nth-child(3){ grid-column:1; }
    table.log td:nth-child(4){ grid-column:2; text-align:right; }
    table.log td:nth-child(3)::before{ content:"Worked "; color:var(--muted); font-family:var(--font-body); font-size:12.5px; }
    table.log td:nth-child(4)::before{ content:"Break "; color:var(--muted); font-family:var(--font-body); font-size:12.5px; }
    table.log td.empty{ grid-column:1 / -1; }
    .pnums small{ white-space:nowrap; }
  }
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<main class="page">
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <!-- Login -->
  <div class="container wrap" id="loginView">
    <section class="t-card login">
      <div class="lock-badge"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
      <h1>Team admin</h1>
      <p class="sub">Sign in to see your team's shift history.</p>
      <form id="loginForm" novalidate>
        <label><span class="label">Email</span><input class="field" id="em" type="email" placeholder="you@amrabdelgawad.site" autocomplete="username" /></label>
        <label><span class="label">Password</span><input class="field" id="pw" type="password" placeholder="••••••••" autocomplete="current-password" /></label>
        <p class="login-err" id="loginErr"></p>
        <button class="btn btn-primary" type="submit" id="loginBtn">Sign in <span class="btn-arrow">&rarr;</span></button>
      </form>
      <p class="login-foot">Only Amr's account can open this page.</p>
    </section>
  </div>

  <!-- Dashboard -->
  <div class="container wrap" id="dashView" hidden>
    <div class="topbar">
      <span class="brand">Amr Abdelgawad</span>
      <div class="who-pill">
        <span id="meEmail"></span>
        <span class="me" id="meAv">A</span>
        <button class="btn btn-ghost btn-sm" id="signOut">Sign out</button>
      </div>
    </div>

    <div class="head">
      <div>
        <p class="eyebrow"><span class="dot-live"></span>Shift tracker</p>
        <h1 class="section-heading">Team hours</h1>
      </div>
      <div class="tools">
        <div class="seg" id="range">
          <button data-r="week" class="on">This week</button>
          <button data-r="month">This month</button>
          <button data-r="all">All time</button>
          <button data-r="custom">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-2px; margin-right:4px;"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Custom
          </button>
        </div>
        <select class="sel" id="person"><option value="">Everyone</option></select>
        <button class="btn btn-outline btn-sm" id="export">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          Export CSV
        </button>
      </div>
    </div>

    <div class="notice" id="notice" hidden></div>

    <div class="t-card custom-range" id="customBox" hidden>
      <label><span class="label">From</span><input class="field" type="date" id="from" /></label>
      <span class="arrow" aria-hidden="true">&rarr;</span>
      <label><span class="label">To</span><input class="field" type="date" id="to" /></label>
      <div class="quick">
        <span class="label">Quick pick</span>
        <div class="chips">
          <button data-q="today">Today</button>
          <button data-q="7">Last 7 days</button>
          <button data-q="lastmonth">Last month</button>
          <button data-q="3m">Last 3 months</button>
        </div>
      </div>
      <p class="range-err" id="rangeErr"></p>
    </div>

    <div class="stats">
      <div class="t-card stat"><p>Shifts</p><strong id="sN">0</strong></div>
      <div class="t-card stat w"><p>Total worked</p><strong id="sW">0h 00m</strong></div>
      <div class="t-card stat b"><p>Total break</p><strong id="sB">0h 00m</strong></div>
      <div class="t-card stat"><p>Avg shift</p><strong id="sA">0h 00m</strong></div>
    </div>

    <section class="t-card people">
      <div class="card-title"><h2>By person</h2><span id="rangeLabel"></span></div>
      <div id="peopleList"></div>
    </section>

    <section class="t-card history">
      <div class="card-title"><h2>History</h2><span id="histCount"></span></div>
      <div style="overflow-x:auto;">
        <table class="log">
          <thead><tr><th>Name</th><th>Shift date</th><th>Worked</th><th>Break</th><th>Clocked</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="undo">Undo</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const cfg = window.TRACKER_CONFIG || {};
  if (!/^https:\/\//.test(cfg.supabaseUrl || '') || !window.supabase) {
    $('loginErr').textContent = 'Not connected yet: add the Supabase URL and key to tracker/config.js.';
    $('loginBtn').setAttribute('aria-busy', 'true');
    return;
  }
  const db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  let log = [];
  let range = 'week', lastDeleted = null, toastTimer = null;

  const hm = s => Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m';
  const initials = n => n.split(/\s+/).map(p => p[0]).slice(0,2).join('').toUpperCase();
  const fmtDate = d => new Date(d+'T00:00').toLocaleDateString('en-US',{ weekday:'short', month:'short', day:'numeric' });
  const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

  // ---- auth (Supabase email + password) ----
  function showDash(email){
    $('loginView').hidden = true; $('dashView').hidden = false;
    $('meEmail').textContent = email; $('meAv').textContent = (email[0] || 'A').toUpperCase();
    load();
  }
  function showLogin(){
    $('dashView').hidden = true; $('loginView').hidden = false;
    log = [];
  }
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const em = $('em').value.trim(), pw = $('pw').value;
    if (!em || !em.includes('@')) { $('loginErr').textContent = 'Enter your email address.'; return; }
    if (!pw) { $('loginErr').textContent = 'Enter your password.'; return; }
    $('loginBtn').setAttribute('aria-busy', 'true');
    const { data, error } = await db.auth.signInWithPassword({ email: em, password: pw });
    $('loginBtn').removeAttribute('aria-busy');
    $('pw').value = '';
    if (error) {
      $('loginErr').textContent = /invalid/i.test(error.message) ? "That email and password don't match." : "Couldn't sign in. Check your connection and try again.";
      return;
    }
    showDash(data.user.email);
  });
  ['em','pw'].forEach(id => $(id).addEventListener('input', () => $('loginErr').textContent = ''));
  $('signOut').addEventListener('click', async () => {
    await db.auth.signOut();
    showLogin();
  });

  // ---- data ----
  const hhmmIso = s => { const d = new Date(s); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
  const toRow = x => ({
    id: x.id, name: x.name, date: x.shift_date, work: x.work_seconds, brk: x.break_seconds,
    startedAt: x.started_at, endedAt: x.ended_at,
    start: hhmmIso(x.started_at), end: hhmmIso(x.ended_at),
    fresh: Date.now() - new Date(x.created_at).getTime() < 24*3600*1000
  });

  async function load(){
    $('notice').hidden = true;
    $('rows').innerHTML = '<tr class="loading"><td colspan="6">Loading shifts…</td></tr>';
    const all = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await db.from('shifts').select('*').order('shift_date', { ascending:false }).order('created_at', { ascending:false }).range(from, from + 999);
      if (error) { showNotice("Couldn't load shifts. Refresh the page to try again."); log = []; render(); return; }
      all.push(...data);
      if (data.length < 1000) break;
    }
    log = all.map(toRow);
    render();
  }
  function showNotice(msg){ $('notice').textContent = msg; $('notice').hidden = false; }

  // ---- filters ----
  function inRange(r){
    if (range === 'all') return true;
    if (range === 'custom') {
      const f = $('from').value, t = $('to').value;
      return (!f || r.date >= f) && (!t || r.date <= t);
    }
    const now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (range === 'week') start.setDate(start.getDate() - ((start.getDay() + 1) % 7)); // weeks start Saturday
    else start.setDate(1);
    return r.date >= iso(start);
  }
  const RANGE_LABEL = { week:'This week (from Saturday)', month:'This month', all:'All time' };
  const shortDate = d => new Date(d+'T00:00').toLocaleDateString('en-US',{ month:'short', day:'numeric', year:'numeric' });
  function rangeLabel(){
    if (range !== 'custom') return RANGE_LABEL[range];
    const f = $('from').value, t = $('to').value;
    if (f && t) return f === t ? shortDate(f) : shortDate(f) + ' – ' + shortDate(t);
    if (f) return 'From ' + shortDate(f);
    if (t) return 'Up to ' + shortDate(t);
    return 'Pick a start and end date';
  }

  $('range').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    range = b.dataset.r;
    document.querySelectorAll('#range button').forEach(x => x.classList.toggle('on', x === b));
    $('customBox').hidden = range !== 'custom';
    if (range === 'custom' && !$('from').value && !$('to').value) quick('lastmonth');
    render();
  });

  function quick(q){
    const now = new Date(); let f = new Date(now), t = new Date(now);
    if (q === '7') f.setDate(f.getDate() - 6);
    if (q === 'lastmonth') { f = new Date(now.getFullYear(), now.getMonth() - 1, 1); t = new Date(now.getFullYear(), now.getMonth(), 0); }
    if (q === '3m') f.setMonth(f.getMonth() - 3);
    $('from').value = iso(f); $('to').value = iso(t); $('rangeErr').textContent = '';
  }
  $('customBox').addEventListener('click', e => {
    const b = e.target.closest('[data-q]'); if (!b) return;
    quick(b.dataset.q); render();
  });
  ['from','to'].forEach(id => $(id).addEventListener('change', () => {
    const f = $('from').value, t = $('to').value;
    if (f && t && f > t) { $('rangeErr').textContent = 'The start date is after the end date. Pick an earlier start or a later end.'; return; }
    $('rangeErr').textContent = '';
    render();
  }));
  $('person').addEventListener('change', render);

  function visible(){
    const p = $('person').value;
    return log.filter(r => inRange(r) && (!p || r.name === p)).sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  }

  function render(){
    const sel = $('person'), cur = sel.value;
    const names = [...new Set(log.map(r => r.name))].sort();
    sel.innerHTML = '<option value="">Everyone</option>';
    names.forEach(n => { const o = document.createElement('option'); o.value = o.textContent = n; sel.appendChild(o); });
    sel.value = names.includes(cur) ? cur : '';

    const rows = visible();
    const tw = rows.reduce((a,r) => a + r.work, 0), tb = rows.reduce((a,r) => a + r.brk, 0);
    $('sN').textContent = rows.length;
    $('sW').textContent = hm(tw);
    $('sB').textContent = hm(tb);
    $('sA').textContent = rows.length ? hm(tw / rows.length) : '0h 00m';
    $('rangeLabel').textContent = rangeLabel();
    $('histCount').textContent = rows.length + ' shift' + (rows.length === 1 ? '' : 's');

    // by person
    const per = {};
    rows.forEach(r => { (per[r.name] = per[r.name] || { w:0, b:0, n:0 }); per[r.name].w += r.work; per[r.name].b += r.brk; per[r.name].n++; });
    const list = Object.entries(per).sort((a,b) => b[1].w - a[1].w);
    const max = Math.max(1, ...list.map(([,v]) => v.w + v.b));
    const pl = $('peopleList'); pl.innerHTML = '';
    if (!list.length) pl.innerHTML = '<p class="empty">No shifts in this range.</p>';
    list.forEach(([name, v]) => {
      const d = document.createElement('div'); d.className = 'person';
      d.innerHTML = '<div class="pname"><span class="av"></span><span class="n"></span></div><div class="pbar"><i class="w"></i><i class="b"></i></div><div class="pnums"><span class="t"></span><small class="s"></small></div>';
      d.querySelector('.av').textContent = initials(name);
      d.querySelector('.n').textContent = name;
      d.querySelector('.t').textContent = hm(v.w);
      d.querySelector('.s').textContent = v.n + ' shift' + (v.n === 1 ? '' : 's') + ' · ' + hm(v.b) + ' break';
      pl.appendChild(d);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        d.querySelector('.w').style.width = (v.w / max * 100) + '%';
        d.querySelector('.b').style.width = (v.b / max * 100) + '%';
      }));
    });

    // history
    const body = $('rows'); body.innerHTML = '';
    if (!rows.length) { body.innerHTML = '<tr><td colspan="6" class="empty">No shifts in this range.</td></tr>'; return; }
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td><div class="who"><span class="av"></span><span class="nm"></span></div></td><td class="muted dt"></td><td class="num w"></td><td class="num b"></td><td class="muted num ck"></td><td style="text-align:right"><button class="del" aria-label="Delete shift"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></td>';
      tr.querySelector('.av').textContent = initials(r.name);
      tr.querySelector('.nm').textContent = r.name;
      if (r.fresh) { const b = document.createElement('span'); b.className = 'new'; b.textContent = 'New'; tr.querySelector('.who').appendChild(b); }
      tr.querySelector('.dt').textContent = fmtDate(r.date);
      tr.querySelector('.w').textContent = hm(r.work);
      tr.querySelector('.b').textContent = hm(r.brk);
      tr.querySelector('.ck').textContent = r.start + ' – ' + r.end;
      tr.querySelector('.del').addEventListener('click', () => remove(r));
      body.appendChild(tr);
    });
  }

  // ---- delete with undo ----
  async function remove(r){
    const i = log.indexOf(r); if (i < 0) return;
    const { error } = await db.from('shifts').delete().eq('id', r.id);
    if (error) { showNotice("Couldn't delete that shift. Try again."); return; }
    log.splice(i, 1);
    lastDeleted = { r, i };
    $('toastMsg').textContent = 'Deleted ' + r.name + "'s shift on " + fmtDate(r.date);
    $('toast').classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').classList.remove('show'); lastDeleted = null; }, 5000);
    render();
  }
  $('undo').addEventListener('click', async () => {
    if (!lastDeleted) return;
    const { r, i } = lastDeleted; lastDeleted = null; $('toast').classList.remove('show');
    const { data, error } = await db.from('shifts').insert({
      name: r.name, shift_date: r.date, work_seconds: r.work, break_seconds: r.brk,
      started_at: r.startedAt, ended_at: r.endedAt
    }).select().single();
    if (error) { showNotice("Couldn't restore that shift."); return; }
    log.splice(i, 0, Object.assign(toRow(data), { fresh: r.fresh })); render();
  });

  // ---- CSV export ----
  $('export').addEventListener('click', () => {
    const esc = v => { let s = String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const lines = [['Name','Shift date','Worked (hours)','Break (hours)','Clock in','Clock out'].map(esc).join(',')];
    visible().forEach(r => lines.push([r.name, r.date, (r.work/3600).toFixed(2), (r.brk/3600).toFixed(2), r.start, r.end].map(esc).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type:'text/csv' }));
    a.download = 'team-shifts-' + (range === 'custom' ? ($('from').value || 'start') + '_to_' + ($('to').value || 'today') : range) + '.csv';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // stay signed in on this device until you sign out
  db.auth.getSession().then(({ data }) => { if (data.session) showDash(data.session.user.email); });
  db.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') showLogin(); });
})();
</script>
</body>
</html>
