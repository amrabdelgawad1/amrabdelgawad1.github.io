# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Stop the deploy if quiz answers or private files were committed
      - name: Guard private files
        run: bash .github/guard-private-files.sh
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Publish the site only: test tools, database files, workflows and notes stay in the repo, off the website
      - name: Copy the site files
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude='./.git' --exclude='./.github' --exclude='./tools' --exclude='./supabase' --exclude='*.md' -cf - . | tar -xf - -C "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/index.html" && test -f "$RUNNER_TEMP/site/CNAME" && test -f "$RUNNER_TEMP/site/app/index.html"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
