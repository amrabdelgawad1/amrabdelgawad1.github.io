# Supabase pauses free projects after 7 days without activity.
# This pings the tracker database twice a week so it stays awake.
name: Keep tracker database awake

on:
  schedule:
    - cron: "17 9 * * 1,4"   # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(sed -n "s/.*supabaseUrl: *'\([^']*\)'.*/\1/p" tracker/config.js)
          KEY=$(sed -n "s/.*supabaseKey: *'\([^']*\)'.*/\1/p" tracker/config.js)
          case "$URL" in https://*) ;; *) echo "Supabase URL not set yet, skipping."; exit 0 ;; esac
          curl -fsS -X POST "$URL/rest/v1/rpc/check_team_code" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"p_code":"keepalive"}'
